      run: |
        $ErrorActionPreference = "Stop"
        $PSNativeCommandUseErrorActionPreference = $false
        $env:AERO_REQUIRE_LLVM_VERIFIER = "true"
        $llvmBin = Join-Path $env:LLVM_ROOT "bin"
