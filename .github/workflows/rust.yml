    - name: Test stable scalar profile application and wrapping corpus at O0 and O2
      if: matrix.rust == 'stable'
      shell: bash
      run: |
        set -euo pipefail
        export PATH="/usr/lib/llvm-22/bin:${PATH}"

        for specimen in application:main.aero:91 wrapping:wrapping_edges.aero:93; do
          IFS=: read -r name file expected <<< "${specimen}"
          source="examples/stable_scalar_v0/${file}"
          llvm="${RUNNER_TEMP}/stable_scalar_${name}.linux.ll"
          machine="${RUNNER_TEMP}/stable_scalar_${name}.linux.s"
          executable_o0="${RUNNER_TEMP}/stable_scalar_${name}.o0"
          executable_o2="${RUNNER_TEMP}/stable_scalar_${name}.o2"

          cargo run --locked --quiet --manifest-path src/compiler/Cargo.toml -- \
            check "${source}" --language-profile stable-scalar-v0
          cargo run --locked --quiet --manifest-path src/compiler/Cargo.toml -- \
            build "${source}" -o "${llvm}" --require-llvm-verifier \
            --language-profile stable-scalar-v0

          grep -Fq 'alloca i32, align 4' "${llvm}"
          if grep -Eq 'double|fptosi|sitofp| nsw | nuw ' "${llvm}"; then
            echo "stable-scalar-v0 ${name} leaked an excluded LLVM numeric lane or overflow promise"
            exit 1
          fi
          opt-22 -passes=verify -disable-output "${llvm}"
          llc-22 -verify-machineinstrs "${llvm}" -o "${machine}"
          clang-22 -O0 "${llvm}" -o "${executable_o0}"
          clang-22 -O2 "${llvm}" -o "${executable_o2}"

          for executable in "${executable_o0}" "${executable_o2}"; do
            stdout="${executable}.stdout"
            stderr="${executable}.stderr"
            set +e
            "${executable}" >"${stdout}" 2>"${stderr}"
            native_status=$?
            set -e
            test "${native_status}" -eq "${expected}"
            test ! -s "${stdout}"
            test ! -s "${stderr}"
          done

          set +e
          public_output="$(cargo run --locked --quiet --manifest-path src/compiler/Cargo.toml -- \
            run "${source}" --language-profile stable-scalar-v0 2>&1)"
          public_status=$?
          set -e
          printf '%s\n' "${public_output}"
          test "${public_status}" -eq "${expected}"
          printf '%s\n' "${public_output}" | grep -Fq "Exit code: ${expected}"
        done

    - name: Test exact i32 fixed-array CPU profile at O0 and O2
      if: matrix.rust == 'stable'
      shell: bash
      run: |
        set -euo pipefail
        export PATH="/usr/lib/llvm-22/bin:${PATH}"

        for specimen in kernel:main.aero:91:yes wrapping:wrapping_edges.aero:93:no matvec:flat_matvec.aero:91:yes scorer:tensor_record_scoring.aero:91:yes inference:relu_argmax_inference.aero:91:yes tokenizer:bootstrap_ascii_tokenizer.aero:91:yes; do
          IFS=: read -r name file expected dynamic_bounds <<< "${specimen}"
          source="examples/fixed_int_array_v0/${file}"
          llvm="${RUNNER_TEMP}/exact_i32_array_${name}.linux.ll"
          machine="${RUNNER_TEMP}/exact_i32_array_${name}.linux.s"
          executable_o0="${RUNNER_TEMP}/exact_i32_array_${name}.o0"
          executable_o2="${RUNNER_TEMP}/exact_i32_array_${name}.o2"

          cargo run --locked --quiet --manifest-path src/compiler/Cargo.toml -- \
            check "${source}" --language-profile exact-i32-array-v0
          cargo run --locked --quiet --manifest-path src/compiler/Cargo.toml -- \
            build "${source}" -o "${llvm}" --require-llvm-verifier \
            --language-profile exact-i32-array-v0

          grep -Fq ' x i32]' "${llvm}"
          grep -Fq 'getelementptr inbounds [' "${llvm}"
          if grep -Eq 'double|fptosi|sitofp| nsw | nuw | x i8]|<[^>]* x i32>' "${llvm}"; then
            echo "exact-i32-array-v0 ${name} leaked an excluded representation or overflow promise"
            exit 1
          fi
          if [ "${name}" = kernel ]; then
            for anchor in \
              'define [8 x i32] @increment_each_lane([8 x i32] %aero.arg.values)' \
              'define [8 x i32] @forward_array([8 x i32] %aero.arg.values)' \
              'call [8 x i32] @increment_each_lane([8 x i32]' \
              'call [8 x i32] @forward_array([8 x i32]' \
              'ret [8 x i32]'; do
              grep -Fq "${anchor}" "${llvm}"
            done
            kernel_mutation_pattern='(?ms)^  (?<kernel_lower>%reg[0-9]+) = icmp sge i32 (?<kernel_index>%reg[0-9]+), 0\r?\n  (?<kernel_upper>%reg[0-9]+) = icmp slt i32 \k<kernel_index>, 8\r?\n  (?<kernel_inbounds>%reg[0-9]+) = and i1 \k<kernel_lower>, \k<kernel_upper>\r?\n  br i1 \k<kernel_inbounds>, label %aero\.bounds\.safe\.(?<kernel_place>[0-9]+), label %aero\.bounds\.trap\.\k<kernel_place>\r?\naero\.bounds\.trap\.\k<kernel_place>:\r?\n  call void @llvm\.trap\(\)\r?\n  unreachable\r?\naero\.bounds\.safe\.\k<kernel_place>:\r?\n  (?<kernel_extended>%reg[0-9]+) = sext i32 \k<kernel_index> to i64\r?\n  (?<kernel_target>%ptr[0-9]+) = getelementptr inbounds \[8 x i32\], \[8 x i32\]\* %ptr[0-9]+, i64 0, i64 \k<kernel_extended>\r?\n(?:(?!^\}).)*?^  store i32 [^,\r\n]+, i32\* \k<kernel_target>, align 4\r?$'
            kernel_mutation_count="$(grep -Pzo -- "${kernel_mutation_pattern}" "${llvm}" | tr -cd '\000' | wc -c)"
            test "${kernel_mutation_count}" -eq 1
          fi
          if [ "${dynamic_bounds}" = yes ]; then
            guard_block_pattern='(?m)^  (?<lower>%reg[0-9]+) = icmp sge i32 (?<index>%reg[0-9]+), 0\r?\n  (?<upper>%reg[0-9]+) = icmp slt i32 \k<index>, [0-9]+\r?\n  (?<inbounds>%reg[0-9]+) = and i1 \k<lower>, \k<upper>\r?\n  br i1 \k<inbounds>, label %aero\.bounds\.safe\.(?<place>[0-9]+), label %aero\.bounds\.trap\.\k<place>\r?\naero\.bounds\.trap\.\k<place>:\r?\n  call void @llvm\.trap\(\)\r?\n  unreachable\r?\naero\.bounds\.safe\.\k<place>:\r?\n  (?<extended>%reg[0-9]+) = sext i32 \k<index> to i64\r?\n  %ptr[0-9]+ = getelementptr inbounds (?<aggregate>\[[0-9]+ x i32\]), \k<aggregate>\* %ptr[0-9]+, i64 0, i64 \k<extended>\r?$'
            guard_count="$(grep -Pzo -- "${guard_block_pattern}" "${llvm}" | tr -cd '\000' | wc -c)"
            if [ "${name}" = matvec ]; then
              test "${guard_count}" -eq 3
            elif [ "${name}" = scorer ]; then
              test "${guard_count}" -eq "$((11 * 2))"
            elif [ "${name}" = inference ]; then
              test "${guard_count}" -eq "$((14 * 2))"
            elif [ "${name}" = tokenizer ]; then
              tokenizer_guard_count="${guard_count}"
              test "${tokenizer_guard_count}" -eq 53
            else
              test "${guard_count}" -eq 4
            fi
          else
            if grep -Eq 'icmp sge i32|call void @llvm\.trap\(\)|sext i32' "${llvm}"; then
              echo "exact-i32-array-v0 wrapping specimen unexpectedly gained dynamic bounds IR"
              exit 1
            fi
          fi
          if [ "${name}" = tokenizer ]; then
            tokenizer_second_llvm="${RUNNER_TEMP}/exact_i32_array_tokenizer.linux.second.ll"
            cargo run --locked --quiet --manifest-path src/compiler/Cargo.toml -- \
              build "${source}" -o "${tokenizer_second_llvm}" --require-llvm-verifier \
              --language-profile exact-i32-array-v0
            cmp -s "${llvm}" "${tokenizer_second_llvm}"
            llvm-as-22 "${llvm}" -o /dev/null
            grep -Fq 'define [75 x i32] @tokenize_ascii_64([64 x i32] %aero.arg.source, i32 %aero.arg.source_len)' "${llvm}"
            test "$(grep -Fc 'call [75 x i32] @tokenize_ascii_64([64 x i32]' "${llvm}")" -eq 8
          fi
          if [ "${name}" = matvec ]; then
            grep -Fq 'define [2 x i32] @matvec_2x3([6 x i32] %aero.arg.matrix, [3 x i32] %aero.arg.vector)' "${llvm}"
            test "$(grep -Fc 'call [2 x i32] @matvec_2x3([6 x i32]' "${llvm}")" -eq 2
            matvec_llvm="$(awk '
              /^define \[2 x i32\] @matvec_2x3\(\[6 x i32\] %aero.arg.matrix, \[3 x i32\] %aero.arg.vector\) \{$/ { capture = 1; definitions++ }
              capture { print }
              capture && /^}$/ { capture = 0 }
              END { if (definitions != 1) exit 1 }
            ' "${llvm}")"
            matvec_identity_pattern='(?ms)^  (?<matvec_row>%reg[0-9]+) = load i32, i32\* (?<matvec_row_slot>%ptr[0-9]+), align 4\r?\n  (?<matvec_row_times_three>%reg[0-9]+) = mul i32 \k<matvec_row>, 3\r?\n  (?<matvec_column>%reg[0-9]+) = load i32, i32\* (?<matvec_column_slot>%ptr[0-9]+), align 4\r?\n  (?<matvec_linear>%reg[0-9]+) = add i32 \k<matvec_row_times_three>, \k<matvec_column>\r?\n  (?<matvec_matrix_lower>%reg[0-9]+) = icmp sge i32 \k<matvec_linear>, 0\r?\n  (?<matvec_matrix_upper>%reg[0-9]+) = icmp slt i32 \k<matvec_linear>, 6\r?\n  (?<matvec_matrix_inbounds>%reg[0-9]+) = and i1 \k<matvec_matrix_lower>, \k<matvec_matrix_upper>\r?\n  br i1 \k<matvec_matrix_inbounds>, label %aero\.bounds\.safe\.(?<matvec_matrix_place>[0-9]+), label %aero\.bounds\.trap\.\k<matvec_matrix_place>\r?\naero\.bounds\.trap\.\k<matvec_matrix_place>:\r?\n  call void @llvm\.trap\(\)\r?\n  unreachable\r?\naero\.bounds\.safe\.\k<matvec_matrix_place>:\r?\n  (?<matvec_matrix_extended>%reg[0-9]+) = sext i32 \k<matvec_linear> to i64\r?\n  (?<matvec_matrix_target>%ptr[0-9]+) = getelementptr inbounds \[6 x i32\], \[6 x i32\]\* %ptr[0-9]+, i64 0, i64 \k<matvec_matrix_extended>\r?\n  %reg[0-9]+ = load i32, i32\* \k<matvec_matrix_target>, align 4\r?\n(?:(?!^}).)*?^  (?<matvec_vector_index>%reg[0-9]+) = load i32, i32\* \k<matvec_column_slot>, align 4\r?\n  (?<matvec_vector_lower>%reg[0-9]+) = icmp sge i32 \k<matvec_vector_index>, 0\r?\n  (?<matvec_vector_upper>%reg[0-9]+) = icmp slt i32 \k<matvec_vector_index>, 3\r?\n  (?<matvec_vector_inbounds>%reg[0-9]+) = and i1 \k<matvec_vector_lower>, \k<matvec_vector_upper>\r?\n  br i1 \k<matvec_vector_inbounds>, label %aero\.bounds\.safe\.(?<matvec_vector_place>[0-9]+), label %aero\.bounds\.trap\.\k<matvec_vector_place>\r?\naero\.bounds\.trap\.\k<matvec_vector_place>:\r?\n  call void @llvm\.trap\(\)\r?\n  unreachable\r?\naero\.bounds\.safe\.\k<matvec_vector_place>:\r?\n  (?<matvec_vector_extended>%reg[0-9]+) = sext i32 \k<matvec_vector_index> to i64\r?\n  (?<matvec_vector_target>%ptr[0-9]+) = getelementptr inbounds \[3 x i32\], \[3 x i32\]\* %ptr[0-9]+, i64 0, i64 \k<matvec_vector_extended>\r?\n  %reg[0-9]+ = load i32, i32\* \k<matvec_vector_target>, align 4\r?\n(?:(?!^}).)*?^  (?<matvec_output_index>%reg[0-9]+) = load i32, i32\* \k<matvec_row_slot>, align 4\r?\n  (?<matvec_output_lower>%reg[0-9]+) = icmp sge i32 \k<matvec_output_index>, 0\r?\n  (?<matvec_output_upper>%reg[0-9]+) = icmp slt i32 \k<matvec_output_index>, 2\r?\n  (?<matvec_output_inbounds>%reg[0-9]+) = and i1 \k<matvec_output_lower>, \k<matvec_output_upper>\r?\n  br i1 \k<matvec_output_inbounds>, label %aero\.bounds\.safe\.(?<matvec_output_place>[0-9]+), label %aero\.bounds\.trap\.\k<matvec_output_place>\r?\naero\.bounds\.trap\.\k<matvec_output_place>:\r?\n  call void @llvm\.trap\(\)\r?\n  unreachable\r?\naero\.bounds\.safe\.\k<matvec_output_place>:\r?\n  (?<matvec_output_extended>%reg[0-9]+) = sext i32 \k<matvec_output_index> to i64\r?\n  (?<matvec_output_target>%ptr[0-9]+) = getelementptr inbounds \[2 x i32\], \[2 x i32\]\* %ptr[0-9]+, i64 0, i64 \k<matvec_output_extended>\r?\n(?:(?!^}).)*?^  store i32 [^,\r\n]+, i32\* \k<matvec_output_target>, align 4\r?$'
            matvec_identity_count="$(grep -Pzo -- "${matvec_identity_pattern}" <(printf '%s\n' "${matvec_llvm}") | tr -cd '\000' | wc -c)"
            test "${matvec_identity_count}" -eq 1
            matvec_guard_pattern='(?m)^  (?<matvec_guard_lower>%reg[0-9]+) = icmp sge i32 (?<matvec_guard_index>%reg[0-9]+), 0\r?\n  (?<matvec_guard_upper>%reg[0-9]+) = icmp slt i32 \k<matvec_guard_index>, (?<matvec_guard_bound>[236])\r?\n  (?<matvec_guard_inbounds>%reg[0-9]+) = and i1 \k<matvec_guard_lower>, \k<matvec_guard_upper>\r?\n  br i1 \k<matvec_guard_inbounds>, label %aero\.bounds\.safe\.(?<matvec_guard_place>[0-9]+), label %aero\.bounds\.trap\.\k<matvec_guard_place>\r?\naero\.bounds\.trap\.\k<matvec_guard_place>:\r?\n  call void @llvm\.trap\(\)\r?\n  unreachable\r?\naero\.bounds\.safe\.\k<matvec_guard_place>:\r?\n  (?<matvec_guard_extended>%reg[0-9]+) = sext i32 \k<matvec_guard_index> to i64\r?\n  %ptr[0-9]+ = getelementptr inbounds \[\k<matvec_guard_bound> x i32\], \[\k<matvec_guard_bound> x i32\]\* %ptr[0-9]+, i64 0, i64 \k<matvec_guard_extended>\r?$'
            matvec_guard_count="$(grep -Pzo -- "${matvec_guard_pattern}" <(printf '%s\n' "${matvec_llvm}") | tr -cd '\000' | wc -c)"
            test "${matvec_guard_count}" -eq 3
          fi
          if [ "${name}" = scorer ]; then
            scorer_second_llvm="${RUNNER_TEMP}/exact_i32_array_scorer.linux.second.ll"
            cargo run --locked --quiet --manifest-path src/compiler/Cargo.toml -- build "${source}" -o "${scorer_second_llvm}" --require-llvm-verifier --language-profile exact-i32-array-v0
            cmp -s "${llvm}" "${scorer_second_llvm}"
            llvm-as-22 "${llvm}" -o /dev/null
            for anchor in \
              'define [6 x i32] @decode_and_score([17 x i32] %aero.arg.record)' \
              'define i32 @affine_2_to_1([2 x i32] %aero.arg.values, [2 x i32] %aero.arg.weights, i32 %aero.arg.bias)' \
              'call [2 x i32] @matvec_2x3([6 x i32]' \
              'call i32 @affine_2_to_1([2 x i32]' \
              'ret [6 x i32]'; do
              grep -Fq "${anchor}" "${llvm}"
            done
            scorer_decode_llvm="$(awk '
              /^define \[6 x i32\] @decode_and_score\(\[17 x i32\] %aero.arg.record\) \{$/ { capture = 1; definitions++ }
              capture { print }
              capture && /^}$/ { capture = 0 }
              END { if (definitions != 1) exit 1 }
            ' "${llvm}")"
            scorer_affine_llvm="$(awk '
              /^define i32 @affine_2_to_1\(\[2 x i32\] %aero.arg.values, \[2 x i32\] %aero.arg.weights, i32 %aero.arg.bias\) \{$/ { capture = 1; definitions++ }
              capture { print }
              capture && /^}$/ { capture = 0 }
              END { if (definitions != 1) exit 1 }
            ' "${llvm}")"
            scorer_matvec_llvm="$(awk '
              /^define \[2 x i32\] @matvec_2x3\(\[6 x i32\] %aero.arg.matrix, \[3 x i32\] %aero.arg.vector\) \{$/ { capture = 1; definitions++ }
              capture { print }
              capture && /^}$/ { capture = 0 }
              END { if (definitions != 1) exit 1 }
            ' "${llvm}")"
            scorer_decode_pattern='(?ms)^define \[6 x i32\] @decode_and_score\(\[17 x i32\] %aero\.arg\.record\) \{\r?\n.*?^  ret \[6 x i32\] %reg[0-9]+\r?\n\}\r?$'
            scorer_decode_count="$(grep -Pzo -- "${scorer_decode_pattern}" <(printf '%s\n' "${scorer_decode_llvm}") | tr -cd '\000' | wc -c)"
            test "${scorer_decode_count}" -eq 1
            scorer_decode_chain_pattern='(?ms)^  (?<scorer_decode_index>%reg[0-9]+) = load i32, i32\* (?<scorer_decode_index_slot>%ptr[0-9]+), align 4\r?\n  (?<scorer_decode_lower>%reg[0-9]+) = icmp sge i32 \k<scorer_decode_index>, 0\r?\n  (?<scorer_decode_upper>%reg[0-9]+) = icmp slt i32 \k<scorer_decode_index>, (?<scorer_decode_bound>[1236])\r?\n  (?<scorer_decode_inbounds>%reg[0-9]+) = and i1 \k<scorer_decode_lower>, \k<scorer_decode_upper>\r?\n  br i1 \k<scorer_decode_inbounds>, label %aero\.bounds\.safe\.(?<scorer_decode_place>[0-9]+), label %aero\.bounds\.trap\.\k<scorer_decode_place>\r?\naero\.bounds\.trap\.\k<scorer_decode_place>:\r?\n  call void @llvm\.trap\(\)\r?\n  unreachable\r?\naero\.bounds\.safe\.\k<scorer_decode_place>:\r?\n  (?<scorer_decode_extended>%reg[0-9]+) = sext i32 \k<scorer_decode_index> to i64\r?\n  (?<scorer_decode_destination>%ptr[0-9]+) = getelementptr inbounds (?<scorer_decode_aggregate>\[(?:1|2|3|6) x i32\]), \k<scorer_decode_aggregate>\* %ptr[0-9]+, i64 0, i64 \k<scorer_decode_extended>\r?\n  (?<scorer_record_source_index>%reg[0-9]+) = load i32, i32\* \k<scorer_decode_index_slot>, align 4(?:\r?\n  (?<scorer_record_index>%reg[0-9]+) = add i32 (?<scorer_record_offset>3|6|12|14|16), \k<scorer_record_source_index>)?\r?\n  (?<scorer_record_lower>%reg[0-9]+) = icmp sge i32 (?(scorer_record_index)\k<scorer_record_index>|\k<scorer_record_source_index>), 0\r?\n  (?<scorer_record_upper>%reg[0-9]+) = icmp slt i32 (?(scorer_record_index)\k<scorer_record_index>|\k<scorer_record_source_index>), 17\r?\n  (?<scorer_record_inbounds>%reg[0-9]+) = and i1 \k<scorer_record_lower>, \k<scorer_record_upper>\r?\n  br i1 \k<scorer_record_inbounds>, label %aero\.bounds\.safe\.(?<scorer_record_place>[0-9]+), label %aero\.bounds\.trap\.\k<scorer_record_place>\r?\naero\.bounds\.trap\.\k<scorer_record_place>:\r?\n  call void @llvm\.trap\(\)\r?\n  unreachable\r?\naero\.bounds\.safe\.\k<scorer_record_place>:\r?\n  (?<scorer_record_extended>%reg[0-9]+) = sext i32 (?(scorer_record_index)\k<scorer_record_index>|\k<scorer_record_source_index>) to i64\r?\n  (?<scorer_record_target>%ptr[0-9]+) = getelementptr inbounds \[17 x i32\], \[17 x i32\]\* %ptr[0-9]+, i64 0, i64 \k<scorer_record_extended>\r?\n  (?<scorer_record_value>%reg[0-9]+) = load i32, i32\* \k<scorer_record_target>, align 4\r?\n  store i32 \k<scorer_record_value>, i32\* \k<scorer_decode_destination>, align 4\r?$'
            scorer_decode_chain_count="$(grep -Pzo -- "${scorer_decode_chain_pattern}" <(printf '%s\n' "${scorer_decode_llvm}") | tr -cd '\000' | wc -c)"
            test "${scorer_decode_chain_count}" -eq 6
            scorer_payload_bound_pattern='(?m)^  (?<scorer_record_index>%reg[0-9]+) = add i32 (?:3|6|12|14|16), %reg[0-9]+\r?\n  %reg[0-9]+ = icmp sge i32 \k<scorer_record_index>, 0\r?\n  %reg[0-9]+ = icmp slt i32 \k<scorer_record_index>, 17\r?$'
