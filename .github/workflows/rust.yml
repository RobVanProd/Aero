row_slot>, align 4\r?\n  (?<inference_mv23_output_lower>%reg[0-9]+) = icmp sge i32 \k<inference_mv23_output_index>, 0\r?\n  (?<inference_mv23_output_upper>%reg[0-9]+) = icmp slt i32 \k<inference_mv23_output_index>, 2\r?\n  (?<inference_mv23_output_inbounds>%reg[0-9]+) = and i1 \k<inference_mv23_output_lower>, \k<inference_mv23_output_upper>\r?\n  br i1 \k<inference_mv23_output_inbounds>, label %aero\.bounds\.safe\.(?<inference_mv23_output_place>[0-9]+), label %aero\.bounds\.trap\.\k<inference_mv23_output_place>\r?\naero\.bounds\.trap\.\k<inference_mv23_output_place>:\r?\n  call void @llvm\.trap\(\)\r?\n  unreachable\r?\naero\.bounds\.safe\.\k<inference_mv23_output_place>:\r?\n  (?<inference_mv23_output_extended>%reg[0-9]+) = sext i32 \k<inference_mv23_output_index> to i64\r?\n  (?<inference_mv23_output_target>%ptr[0-9]+) = getelementptr inbounds \[2 x i32\], \[2 x i32\]\* \k<inference_mv23_output_base>, i64 0, i64 \k<inference_mv23_output_extended>\r?\n  (?<inference_mv23_output_value>%reg[0-9]+) = load i32, i32\* \k<inference_mv23_accumulator_slot>, align 4\r?\n  store i32 \k<inference_mv23_output_value>, i32\* \k<inference_mv23_output_target>, align 4\r?$'
            $inferenceMatvec2x3Matches = [regex]::Matches($inferenceMatvec2x3Text, $inferenceMatvec2x3Pattern)
            if ($inferenceMatvec2x3Matches.Count -ne 1) {
              throw "Windows exact-i32-array-v0 inference omitted its exact matvec_2x3 row-major identity"
            }
            $inferenceMatvec2x2Pattern = '(?ms)^  (?<inference_mv22_matrix_base>%ptr[0-9]+) = alloca \[4 x i32\], align 8\r?\n  store \[4 x i32\] %aero\.arg\.matrix, \[4 x i32\]\* \k<inference_mv22_matrix_base>, align 8\r?\n  (?<inference_mv22_vector_base>(?!\k<inference_mv22_matrix_base>)%ptr[0-9]+) = alloca \[2 x i32\], align 8\r?\n  store \[2 x i32\] %aero\.arg\.vector, \[2 x i32\]\* \k<inference_mv22_vector_base>, align 8(?:(?!^}).)*?^  (?<inference_mv22_output_base>(?!\k<inference_mv22_matrix_base>)(?!\k<inference_mv22_vector_base>)%ptr[0-9]+) = alloca \[2 x i32\], align 8\r?\n  store \[2 x i32\] %reg[0-9]+, \[2 x i32\]\* \k<inference_mv22_output_base>, align 8\r?\n  (?<inference_mv22_row_slot>%ptr[0-9]+) = alloca i32, align 4(?:(?!^}).)*?^  (?<inference_mv22_column_slot>%ptr[0-9]+) = alloca i32, align 4(?:(?!^}).)*?^  (?<inference_mv22_accumulator_slot>%ptr[0-9]+) = alloca i32, align 4\r?\n  store i32 0, i32\* \k<inference_mv22_accumulator_slot>, align 4(?:(?!^}).)*?^  (?<inference_mv22_accumulator>%reg[0-9]+) = load i32, i32\* \k<inference_mv22_accumulator_slot>, align 4\r?\n  (?<inference_mv22_row>%reg[0-9]+) = load i32, i32\* \k<inference_mv22_row_slot>, align 4\r?\n  (?<inference_mv22_row_times_two>%reg[0-9]+) = mul i32 \k<inference_mv22_row>, 2\r?\n  (?<inference_mv22_column>%reg[0-9]+) = load i32, i32\* \k<inference_mv22_column_slot>, align 4\r?\n  (?<inference_mv22_linear>%reg[0-9]+) = add i32 \k<inference_mv22_row_times_two>, \k<inference_mv22_column>\r?\n  (?<inference_mv22_matrix_lower>%reg[0-9]+) = icmp sge i32 \k<inference_mv22_linear>, 0\r?\n  (?<inference_mv22_matrix_upper>%reg[0-9]+) = icmp slt i32 \k<inference_mv22_linear>, 4\r?\n  (?<inference_mv22_matrix_inbounds>%reg[0-9]+) = and i1 \k<inference_mv22_matrix_lower>, \k<inference_mv22_matrix_upper>\r?\n  br i1 \k<inference_mv22_matrix_inbounds>, label %aero\.bounds\.safe\.(?<inference_mv22_matrix_place>[0-9]+), label %aero\.bounds\.trap\.\k<inference_mv22_matrix_place>\r?\naero\.bounds\.trap\.\k<inference_mv22_matrix_place>:\r?\n  call void @llvm\.trap\(\)\r?\n  unreachable\r?\naero\.bounds\.safe\.\k<inference_mv22_matrix_place>:\r?\n  (?<inference_mv22_matrix_extended>%reg[0-9]+) = sext i32 \k<inference_mv22_linear> to i64\r?\n  (?<inference_mv22_matrix_target>%ptr[0-9]+) = getelementptr inbounds \[4 x i32\], \[4 x i32\]\* \k<inference_mv22_matrix_base>, i64 0, i64 \k<inference_mv22_matrix_extended>\r?\n  (?<inference_mv22_matrix_value>%reg[0-9]+) = load i32, i32\* \k<inference_mv22_matrix_target>, align 4\r?\n  (?<inference_mv22_vector_index>%reg[0-9]+) = load i32, i32\* \k<inference_mv22_column_slot>, align 4\r?\n  (?<inference_mv22_vector_lower>%reg[0-9]+) = icmp sge i32 \k<inference_mv22_vector_index>, 0\r?\n  (?<inference_mv22_vector_upper>%reg[0-9]+) = icmp slt i32 \k<inference_mv22_vector_index>, 2\r?\n  (?<inference_mv22_vector_inbounds>%reg[0-9]+) = and i1 \k<inference_mv22_vector_lower>, \k<inference_mv22_vector_upper>\r?\n  br i1 \k<inference_mv22_vector_inbounds>, label %aero\.bounds\.safe\.(?<inference_mv22_vector_place>[0-9]+), label %aero\.bounds\.trap\.\k<inference_mv22_vector_place>\r?\naero\.bounds\.trap\.\k<inference_mv22_vector_place>:\r?\n  call void @llvm\.trap\(\)\r?\n  unreachable\r?\naero\.bounds\.safe\.\k<inference_mv22_vector_place>:\r?\n  (?<inference_mv22_vector_extended>%reg[0-9]+) = sext i32 \k<inference_mv22_vector_index> to i64\r?\n  (?<inference_mv22_vector_target>%ptr[0-9]+) = getelementptr inbounds \[2 x i32\], \[2 x i32\]\* \k<inference_mv22_vector_base>, i64 0, i64 \k<inference_mv22_vector_extended>\r?\n  (?<inference_mv22_vector_value>%reg[0-9]+) = load i32, i32\* \k<inference_mv22_vector_target>, align 4\r?\n  (?<inference_mv22_product>%reg[0-9]+) = mul i32 \k<inference_mv22_matrix_value>, \k<inference_mv22_vector_value>\r?\n  (?<inference_mv22_sum>%reg[0-9]+) = add i32 \k<inference_mv22_accumulator>, \k<inference_mv22_product>\r?\n  store i32 \k<inference_mv22_sum>, i32\* \k<inference_mv22_accumulator_slot>, align 4(?:(?!^}).)*?^  (?<inference_mv22_output_index>%reg[0-9]+) = load i32, i32\* \k<inference_mv22_row_slot>, align 4\r?\n  (?<inference_mv22_output_lower>%reg[0-9]+) = icmp sge i32 \k<inference_mv22_output_index>, 0\r?\n  (?<inference_mv22_output_upper>%reg[0-9]+) = icmp slt i32 \k<inference_mv22_output_index>, 2\r?\n  (?<inference_mv22_output_inbounds>%reg[0-9]+) = and i1 \k<inference_mv22_output_lower>, \k<inference_mv22_output_upper>\r?\n  br i1 \k<inference_mv22_output_inbounds>, label %aero\.bounds\.safe\.(?<inference_mv22_output_place>[0-9]+), label %aero\.bounds\.trap\.\k<inference_mv22_output_place>\r?\naero\.bounds\.trap\.\k<inference_mv22_output_place>:\r?\n  call void @llvm\.trap\(\)\r?\n  unreachable\r?\naero\.bounds\.safe\.\k<inference_mv22_output_place>:\r?\n  (?<inference_mv22_output_extended>%reg[0-9]+) = sext i32 \k<inference_mv22_output_index> to i64\r?\n  (?<inference_mv22_output_target>%ptr[0-9]+) = getelementptr inbounds \[2 x i32\], \[2 x i32\]\* \k<inference_mv22_output_base>, i64 0, i64 \k<inference_mv22_output_extended>\r?\n  (?<inference_mv22_output_value>%reg[0-9]+) = load i32, i32\* \k<inference_mv22_accumulator_slot>, align 4\r?\n  store i32 \k<inference_mv22_output_value>, i32\* \k<inference_mv22_output_target>, align 4\r?$'
            $inferenceMatvec2x2Matches = [regex]::Matches($inferenceMatvec2x2Text, $inferenceMatvec2x2Pattern)
            if ($inferenceMatvec2x2Matches.Count -ne 1) {
              throw "Windows exact-i32-array-v0 inference omitted its exact matvec_2x2 row-major identity"
            }
            $inferenceGuardPattern = '(?m)^  (?<inference_guard_lower>%reg[0-9]+) = icmp sge i32 (?<inference_guard_index>%reg[0-9]+), 0\r?\n  (?<inference_guard_upper>%reg[0-9]+) = icmp slt i32 \k<inference_guard_index>, (?<inference_guard_bound>[0-9]+)\r?\n  (?<inference_guard_inbounds>%reg[0-9]+) = and i1 \k<inference_guard_lower>, \k<inference_guard_upper>\r?\n  br i1 \k<inference_guard_inbounds>, label %aero\.bounds\.safe\.(?<inference_guard_place>[0-9]+), label %aero\.bounds\.trap\.\k<inference_guard_place>\r?\naero\.bounds\.trap\.\k<inference_guard_place>:\r?\n  call void @llvm\.trap\(\)\r?\n  unreachable\r?\naero\.bounds\.safe\.\k<inference_guard_place>:\r?\n  (?<inference_guard_extended>%reg[0-9]+) = sext i32 \k<inference_guard_index> to i64\r?\n  %ptr[0-9]+ = getelementptr inbounds (?<inference_guard_aggregate>\[\k<inference_guard_bound> x i32\]), \k<inference_guard_aggregate>\* %ptr[0-9]+, i64 0, i64 \k<inference_guard_extended>\r?$'
            $inferenceGuardMatches = [regex]::Matches($inferenceDecodeText, $inferenceGuardPattern)
            if ($inferenceGuardMatches.Count -ne 18) {
              throw "Windows exact-i32-array-v0 inference decoder expected eighteen complete guard/address chains"
            }
            $inferenceMatvec2x3GuardMatches = [regex]::Matches($inferenceMatvec2x3Text, $inferenceGuardPattern)
            if ($inferenceMatvec2x3GuardMatches.Count -ne 3) {
              throw "Windows exact-i32-array-v0 inference matvec_2x3 expected three complete guard/address chains"
            }
            $inferenceMatvec2x2GuardMatches = [regex]::Matches($inferenceMatvec2x2Text, $inferenceGuardPattern)
            if ($inferenceMatvec2x2GuardMatches.Count -ne 3) {
              throw "Windows exact-i32-array-v0 inference matvec_2x2 expected three complete guard/address chains"
            }
          }

          & "$llvmBin\opt.exe" -passes=verify -disable-output $llvm
          if ($LASTEXITCODE -ne 0) {
            throw "Windows exact-i32-array-v0 $($specimen.Name) opt verification failed"
          }
          & "$llvmBin\llc.exe" -verify-machineinstrs $llvm -o $machine
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $machine -PathType Leaf)) {
            throw "Windows exact-i32-array-v0 $($specimen.Name) machine verification failed"
          }
          & "$llvmBin\clang.exe" -O0 $llvm -o $executableO0
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $executableO0 -PathType Leaf)) {
            throw "Windows exact-i32-array-v0 $($specimen.Name) O0 link failed"
          }
          & "$llvmBin\clang.exe" -O2 $llvm -o $executableO2
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $executableO2 -PathType Leaf)) {
            throw "Windows exact-i32-array-v0 $($specimen.Name) O2 link failed"
          }

          foreach ($executable in @($executableO0, $executableO2)) {
            $native = Invoke-ExactI32Array $executable
            if ($native.ExitCode -ne $specimen.Expected -or $native.Stdout -cne "" -or $native.Stderr -cne "") {
              throw "Windows exact-i32-array-v0 $($specimen.Name) native behavior diverged"
            }
          }

          $publicOutput = @(cargo run --locked --quiet --manifest-path src/compiler/Cargo.toml -- run $source --language-profile exact-i32-array-v0 2>&1)
          $publicStatus = $LASTEXITCODE
          $publicOutput | ForEach-Object { Write-Host $_ }
          if ($publicStatus -ne $specimen.Expected) {
            throw "Windows exact-i32-array-v0 $($specimen.Name) public run returned $publicStatus"
          }
          if (@($publicOutput | Where-Object { $_.ToString() -ceq "Exit code: $($specimen.Expected)" }).Count -ne 1) {
            throw "Windows exact-i32-array-v0 $($specimen.Name) public run omitted its exact exit line"
          }
        }

        foreach ($boundsFile in @("negative_index.aero", "equal_to_count_index.aero", "negative_write_index.aero", "equal_to_count_write_index.aero")) {
          $boundsCase = [System.IO.Path]::GetFileNameWithoutExtension($boundsFile)
          $boundsSource = "examples/fixed_int_array_v0/runtime_fail/$boundsFile"
          $boundsLlvm = Join-Path $env:RUNNER_TEMP "exact_i32_array_$boundsCase.windows.ll"
          $boundsMachine = Join-Path $env:RUNNER_TEMP "exact_i32_array_$boundsCase.windows.s"

          cargo run --locked --quiet --manifest-path src/compiler/Cargo.toml -- check $boundsSource --language-profile exact-i32-array-v0
          if ($LASTEXITCODE -ne 0) {
            throw "Windows exact-i32-array-v0 $boundsCase public check failed"
          }
          cargo run --locked --quiet --manifest-path src/compiler/Cargo.toml -- build $boundsSource -o $boundsLlvm --require-llvm-verifier --language-profile exact-i32-array-v0
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $boundsLlvm -PathType Leaf)) {
            throw "Windows exact-i32-array-v0 $boundsCase public build failed"
          }
          $boundsText = Get-Content -LiteralPath $boundsLlvm -Raw
          foreach ($anchor in @("declare void @llvm.trap()", "icmp sge i32", "icmp slt i32", "sext i32")) {
            if (-not $boundsText.Contains($anchor)) {
              throw "Windows exact-i32-array-v0 $boundsCase omitted $anchor"
            }
          }
          if ($boundsCase.EndsWith("_write_index", [System.StringComparison]::Ordinal)) {
            $boundsWritePattern = '(?m)^  (?<bounds_write_lower>%reg[0-9]+) = icmp sge i32 (?<bounds_write_index>%reg[0-9]+), 0\r?\n  (?<bounds_write_upper>%reg[0-9]+) = icmp slt i32 \k<bounds_write_index>, 2\r?\n  (?<bounds_write_inbounds>%reg[0-9]+) = and i1 \k<bounds_write_lower>, \k<bounds_write_upper>\r?\n  br i1 \k<bounds_write_inbounds>, label %aero\.bounds\.safe\.(?<bounds_write_place>[0-9]+), label %aero\.bounds\.trap\.\k<bounds_write_place>\r?\naero\.bounds\.trap\.\k<bounds_write_place>:\r?\n  call void @llvm\.trap\(\)\r?\n  unreachable\r?\naero\.bounds\.safe\.\k<bounds_write_place>:\r?\n  (?<bounds_write_extended>%reg[0-9]+) = sext i32 \k<bounds_write_index> to i64\r?\n  (?<bounds_write_target>%ptr[0-9]+) = getelementptr inbounds \[2 x i32\], \[2 x i32\]\* %ptr[0-9]+, i64 0, i64 \k<bounds_write_extended>\r?\n  store i32 9, i32\* \k<bounds_write_target>, align 4\r?$'
            $boundsWriteMatches = [regex]::Matches($boundsText, $boundsWritePattern)
            if ($boundsWriteMatches.Count -ne 1) {
              throw "Windows exact-i32-array-v0 $boundsCase omitted its identity-linked guarded mutable store"
            }
          }
          & "$llvmBin\opt.exe" -passes=verify -disable-output $boundsLlvm
          if ($LASTEXITCODE -ne 0) {
            throw "Windows exact-i32-array-v0 $boundsCase opt verification failed"
          }
          & "$llvmBin\llc.exe" -verify-machineinstrs $boundsLlvm -o $boundsMachine
          if ($LASTEXITCODE -ne 0) {
            throw "Windows exact-i32-array-v0 $boundsCase machine verification failed"
          }

          $publicOutput = @(cargo run --locked --quiet --manifest-path src/compiler/Cargo.toml -- run $boundsSource --language-profile exact-i32-array-v0 2>&1)
          $publicStatus = $LASTEXITCODE
          $publicOutput | ForEach-Object { Write-Host $_ }
          if ($publicStatus -eq 0) {
            throw "Windows exact-i32-array-v0 $boundsCase public run did not trap"
          }

          foreach ($optimization in @(0, 2)) {
            $boundsExecutable = Join-Path $env:RUNNER_TEMP "exact_i32_array_$boundsCase.o$optimization.exe"
            & "$llvmBin\clang.exe" "-O$optimization" $boundsLlvm -o $boundsExecutable
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $boundsExecutable -PathType Leaf)) {
              throw "Windows exact-i32-array-v0 $boundsCase O$optimization link failed"
            }
            $native = Invoke-ExactI32Array $boundsExecutable
            if ($native.ExitCode -eq 0 -or $native.Stdout -cne "" -or $native.Stderr -cne "") {
              throw "Windows exact-i32-array-v0 $boundsCase O$optimization did not fail cleanly"
            }
          }
        }
        Write-Host "exact i32 fixed-array CPU profile passed on Windows at O0 and O2"
        $global:LASTEXITCODE = 0

    - name: Test exact i32 record and Result CPU profile on Windows at O0 and O2
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $PSNativeCommandUseErrorActionPreference = $false
        $env:AERO_REQUIRE_LLVM_VERIFIER = "true"
        $llvmBin = Join-Path $env:LLVM_ROOT "bin"
        $source = "examples/fixed_int_array_v0/exact_record_result_application.aero"
        $llvm = Join-Path $env:RUNNER_TEMP "exact_record_result.windows.ll"
        $repeatLlvm = Join-Path $env:RUNNER_TEMP "exact_record_result.windows.repeat.ll"
        $bitcode = Join-Path $env:RUNNER_TEMP "exact_record_result.windows.bc"
        $machine = Join-Path $env:RUNNER_TEMP "exact_record_result.windows.s"
        $executableO0 = Join-Path $env:RUNNER_TEMP "exact_record_result.o0.exe"
        $executableO2 = Join-Path $env:RUNNER_TEMP "exact_record_result.o2.exe"

        function Invoke-ExactRecordResult([string] $Path) {
          $start = [System.Diagnostics.ProcessStartInfo]::new()
          $start.FileName = $Path
          $start.UseShellExecute = $false
          $start.CreateNoWindow = $true
          $start.RedirectStandardOutput = $true
          $start.RedirectStandardError = $true
          $process = [System.Diagnostics.Process]::new()
          $process.StartInfo = $start
          if (-not $process.Start()) {
            throw "failed to start $Path"
          }
          $stdout = $process.StandardOutput.ReadToEndAsync()
