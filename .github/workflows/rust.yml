    - name: Test stable scalar profile application and wrapping corpus at O0 and O2
      if: matrix.rust == 'stable'
      shell: bash
      run: |
        set -euo pipefail
        export PATH="/usr/lib/llvm-22/bin:${PATH}"

        for specimen in application:main.aero:91 wrapping:wrapping_edges.aero:93; do
          IFS=: read -r name file expected <<< "${specimen}"
          source="examples/stable_scalar_v0/${file}"
          llvm="${RUNNER_TEMP}/stable_scalar_${name}.linux.ll"
          machine="${RUNNER_TEMP}/stable_scalar_${name}.linux.s"
          executable_o0="${RUNNER_TEMP}/stable_scalar_${name}.o0"
          executable_o2="${RUNNER_TEMP}/stable_scalar_${name}.o2"

          cargo run --locked --quiet --manifest-path src/compiler/Cargo.toml -- \
            check "${source}" --language-profile stable-scalar-v0
          cargo run --locked --quiet --manifest-path src/compiler/Cargo.toml -- \
            build "${source}" -o "${llvm}" --require-llvm-verifier \
            --language-profile stable-scalar-v0

          grep -Fq 'alloca i32, align 4' "${llvm}"
          if grep -Eq 'double|fptosi|sitofp| nsw | nuw ' "${llvm}"; then
            echo "stable-scalar-v0 ${name} leaked an excluded LLVM numeric lane or overflow promise"
            exit 1
          fi
          opt-22 -passes=verify -disable-output "${llvm}"
          llc-22 -verify-machineinstrs "${llvm}" -o "${machine}"
          clang-22 -O0 "${llvm}" -o "${executable_o0}"
          clang-22 -O2 "${llvm}" -o "${executable_o2}"

          for executable in "${executable_o0}" "${executable_o2}"; do
            stdout="${executable}.stdout"
            stderr="${executable}.stderr"
            set +e
            "${executable}" >"${stdout}" 2>"${stderr}"
            native_status=$?
            set -e
            test "${native_status}" -eq "${expected}"
            test ! -s "${stdout}"
            test ! -s "${stderr}"
          done

          set +e
          public_output="$(cargo run --locked --quiet --manifest-path src/compiler/Cargo.toml -- \
            run "${source}" --language-profile stable-scalar-v0 2>&1)"
          public_status=$?
          set -e
          printf '%s\n' "${public_output}"
          test "${public_status}" -eq "${expected}"
          printf '%s\n' "${public_output}" | grep -Fq "Exit code: ${expected}"
        done

    - name: Test exact i32 fixed-array CPU profile at O0 and O2
      if: matrix.rust == 'stable'
      shell: bash
      run: |
        set -euo pipefail
        export PATH="/usr/lib/llvm-22/bin:${PATH}"

        for specimen in kernel:main.aero:91:yes wrapping:wrapping_edges.aero:93:no; do
          IFS=: read -r name file expected dynamic_bounds <<< "${specimen}"
          source="examples/fixed_int_array_v0/${file}"
          llvm="${RUNNER_TEMP}/exact_i32_array_${name}.linux.ll"
          machine="${RUNNER_TEMP}/exact_i32_array_${name}.linux.s"
          executable_o0="${RUNNER_TEMP}/exact_i32_array_${name}.o0"
          executable_o2="${RUNNER_TEMP}/exact_i32_array_${name}.o2"

          cargo run --locked --quiet --manifest-path src/compiler/Cargo.toml -- \
            check "${source}" --language-profile exact-i32-array-v0
          cargo run --locked --quiet --manifest-path src/compiler/Cargo.toml -- \
            build "${source}" -o "${llvm}" --require-llvm-verifier \
            --language-profile exact-i32-array-v0

          grep -Fq ' x i32]' "${llvm}"
          grep -Fq 'getelementptr inbounds [' "${llvm}"
          if grep -Eq 'double|fptosi|sitofp| nsw | nuw | x i8]|<[^>]* x i32>' "${llvm}"; then
            echo "exact-i32-array-v0 ${name} leaked an excluded representation or overflow promise"
            exit 1
          fi
          if [ "${name}" = kernel ]; then
            for anchor in \
              'define [8 x i32] @increment_each_lane([8 x i32] %aero.arg.values)' \
              'define [8 x i32] @forward_array([8 x i32] %aero.arg.values)' \
              'call [8 x i32] @increment_each_lane([8 x i32]' \
              'call [8 x i32] @forward_array([8 x i32]' \
              'ret [8 x i32]'; do
              grep -Fq "${anchor}" "${llvm}"
            done
            kernel_mutation_pattern='(?ms)^  (?<kernel_lower>%reg[0-9]+) = icmp sge i32 (?<kernel_index>%reg[0-9]+), 0\r?\n  (?<kernel_upper>%reg[0-9]+) = icmp slt i32 \k<kernel_index>, 8\r?\n  (?<kernel_inbounds>%reg[0-9]+) = and i1 \k<kernel_lower>, \k<kernel_upper>\r?\n  br i1 \k<kernel_inbounds>, label %aero\.bounds\.safe\.(?<kernel_place>[0-9]+), label %aero\.bounds\.trap\.\k<kernel_place>\r?\naero\.bounds\.trap\.\k<kernel_place>:\r?\n  call void @llvm\.trap\(\)\r?\n  unreachable\r?\naero\.bounds\.safe\.\k<kernel_place>:\r?\n  (?<kernel_extended>%reg[0-9]+) = sext i32 \k<kernel_index> to i64\r?\n  (?<kernel_target>%ptr[0-9]+) = getelementptr inbounds \[8 x i32\], \[8 x i32\]\* %ptr[0-9]+, i64 0, i64 \k<kernel_extended>\r?\n(?:(?!^\}).)*?^  store i32 [^,\r\n]+, i32\* \k<kernel_target>, align 4\r?$'
            kernel_mutation_count="$(grep -Pzo -- "${kernel_mutation_pattern}" "${llvm}" | tr -cd '\000' | wc -c)"
            test "${kernel_mutation_count}" -eq 1
          fi
          if [ "${dynamic_bounds}" = yes ]; then
            guard_block_pattern='(?m)^  (?<lower>%reg[0-9]+) = icmp sge i32 (?<index>%reg[0-9]+), 0\r?\n  (?<upper>%reg[0-9]+) = icmp slt i32 \k<index>, [0-9]+\r?\n  (?<inbounds>%reg[0-9]+) = and i1 \k<lower>, \k<upper>\r?\n  br i1 \k<inbounds>, label %aero\.bounds\.safe\.(?<place>[0-9]+), label %aero\.bounds\.trap\.\k<place>\r?\naero\.bounds\.trap\.\k<place>:\r?\n  call void @llvm\.trap\(\)\r?\n  unreachable\r?\naero\.bounds\.safe\.\k<place>:\r?\n  (?<extended>%reg[0-9]+) = sext i32 \k<index> to i64\r?\n  %ptr[0-9]+ = getelementptr inbounds (?<aggregate>\[[0-9]+ x i32\]), \k<aggregate>\* %ptr[0-9]+, i64 0, i64 \k<extended>\r?$'
            guard_count="$(grep -Pzo -- "${guard_block_pattern}" "${llvm}" | tr -cd '\000' | wc -c)"
            test "${guard_count}" -eq 4
          else
            if grep -Eq 'icmp sge i32|call void @llvm\.trap\(\)|sext i32' "${llvm}"; then
              echo "exact-i32-array-v0 wrapping specimen unexpectedly gained dynamic bounds IR"
              exit 1
            fi
          fi

          opt-22 -passes=verify -disable-output "${llvm}"
          llc-22 -verify-machineinstrs "${llvm}" -o "${machine}"
          clang-22 -O0 "${llvm}" -o "${executable_o0}"
          clang-22 -O2 "${llvm}" -o "${executable_o2}"

          for executable in "${executable_o0}" "${executable_o2}"; do
            stdout="${executable}.stdout"
            stderr="${executable}.stderr"
            set +e
            "${executable}" >"${stdout}" 2>"${stderr}"
            native_status=$?
            set -e
            test "${native_status}" -eq "${expected}"
            test ! -s "${stdout}"
            test ! -s "${stderr}"
          done

          set +e
          public_output="$(cargo run --locked --quiet --manifest-path src/compiler/Cargo.toml -- \
            run "${source}" --language-profile exact-i32-array-v0 2>&1)"
          public_status=$?
          set -e
          printf '%s\n' "${public_output}"
          test "${public_status}" -eq "${expected}"
          printf '%s\n' "${public_output}" | grep -Fq "Exit code: ${expected}"
        done

        for bounds_file in negative_index.aero equal_to_count_index.aero negative_write_index.aero equal_to_count_write_index.aero; do
          bounds_case="${bounds_file%.aero}"
          bounds_source="examples/fixed_int_array_v0/runtime_fail/${bounds_file}"
          bounds_llvm="${RUNNER_TEMP}/exact_i32_array_${bounds_case}.linux.ll"
          bounds_machine="${RUNNER_TEMP}/exact_i32_array_${bounds_case}.linux.s"

          cargo run --locked --quiet --manifest-path src/compiler/Cargo.toml -- \
            check "${bounds_source}" --language-profile exact-i32-array-v0
          cargo run --locked --quiet --manifest-path src/compiler/Cargo.toml -- \
            build "${bounds_source}" -o "${bounds_llvm}" --require-llvm-verifier \
            --language-profile exact-i32-array-v0
          grep -Fq 'declare void @llvm.trap()' "${bounds_llvm}"
          grep -Fq 'icmp sge i32' "${bounds_llvm}"
          grep -Fq 'icmp slt i32' "${bounds_llvm}"
          grep -Fq 'sext i32' "${bounds_llvm}"
          if [[ "${bounds_case}" == *_write_index ]]; then
            bounds_write_pattern='(?m)^  (?<bounds_write_lower>%reg[0-9]+) = icmp sge i32 (?<bounds_write_index>%reg[0-9]+), 0\r?\n  (?<bounds_write_upper>%reg[0-9]+) = icmp slt i32 \k<bounds_write_index>, 2\r?\n  (?<bounds_write_inbounds>%reg[0-9]+) = and i1 \k<bounds_write_lower>, \k<bounds_write_upper>\r?\n  br i1 \k<bounds_write_inbounds>, label %aero\.bounds\.safe\.(?<bounds_write_place>[0-9]+), label %aero\.bounds\.trap\.\k<bounds_write_place>\r?\naero\.bounds\.trap\.\k<bounds_write_place>:\r?\n  call void @llvm\.trap\(\)\r?\n  unreachable\r?\naero\.bounds\.safe\.\k<bounds_write_place>:\r?\n  (?<bounds_write_extended>%reg[0-9]+) = sext i32 \k<bounds_write_index> to i64\r?\n  (?<bounds_write_target>%ptr[0-9]+) = getelementptr inbounds \[2 x i32\], \[2 x i32\]\* %ptr[0-9]+, i64 0, i64 \k<bounds_write_extended>\r?\n  store i32 9, i32\* \k<bounds_write_target>, align 4\r?$'
            bounds_write_count="$(grep -Pzo -- "${bounds_write_pattern}" "${bounds_llvm}" | tr -cd '\000' | wc -c)"
            test "${bounds_write_count}" -eq 1
          fi
          opt-22 -passes=verify -disable-output "${bounds_llvm}"
          llc-22 -verify-machineinstrs "${bounds_llvm}" -o "${bounds_machine}"

          set +e
          cargo run --locked --quiet --manifest-path src/compiler/Cargo.toml -- \
            run "${bounds_source}" --language-profile exact-i32-array-v0
          public_bounds_status=$?
          set -e
          test "${public_bounds_status}" -ne 0

          for optimization in 0 2; do
            bounds_executable="${RUNNER_TEMP}/exact_i32_array_${bounds_case}.o${optimization}"
            clang-22 "-O${optimization}" "${bounds_llvm}" -o "${bounds_executable}"
            set +e
            "${bounds_executable}" >"${bounds_executable}.stdout" 2>"${bounds_executable}.stderr"
            bounds_status=$?
            set -e
            test "${bounds_status}" -ne 0
            test ! -s "${bounds_executable}.stdout"
            test ! -s "${bounds_executable}.stderr"
          done
        done
        echo "exact i32 fixed-array CPU profile passed at O0 and O2"

    - name: Test representative telemetry application at O0 and O2
      if: matrix.rust == 'stable'
      shell: bash
      run: |
        export PATH="/usr/lib/llvm-22/bin:${PATH}"
        representative_source="../../examples/representative_telemetry/main.aero"
        representative_llvm="${RUNNER_TEMP}/representative_telemetry.ll"
        representative_machine="${RUNNER_TEMP}/representative_telemetry.s"
        representative_o0="${RUNNER_TEMP}/representative_telemetry.o0"
        representative_o2="${RUNNER_TEMP}/representative_telemetry.o2"
        runtime_fail_root="../../examples/representative_telemetry/runtime_fail"
        cd src/compiler

        cargo run --locked --quiet -- check "${representative_source}"
        set +e
        public_run_output="$(cargo run --locked --quiet -- run "${representative_source}" 2>&1)"
        public_run_exit=$?
        set -e
        printf '%s\n' "${public_run_output}"
        test "${public_run_exit}" -eq 91
        public_output_count="$(printf '%s\n' "${public_run_output}" | grep -c '^Output: telemetry score: 91$' || true)"
        test "${public_output_count}" -eq 1

        cargo run --locked --quiet -- build "${representative_source}" \
          -o "${representative_llvm}" --require-llvm-verifier
        grep -Fq 'call i32 (i8*, ...) @printf(' "${representative_llvm}"
        grep -Fq '; Aero generic enum: Sample<Reading<int>>' "${representative_llvm}"
        grep -Fq '; Aero generic enum: Sample<char>' "${representative_llvm}"
        grep -Fq 'aero.trait.PolicyValue.for.Sensor.policy_value' "${representative_llvm}"
        grep -Fq 'aero.trait.PolicyValue.for.Batch.policy_value' "${representative_llvm}"
        grep -Fq 'aero.generic.window_get<int>' "${representative_llvm}"
        grep -Fq 'aero.generic.window_get<char>' "${representative_llvm}"
        grep -Fq 'aero.generic.window_set<int>' "${representative_llvm}"
        grep -Fq 'aero.generic.window_set<char>' "${representative_llvm}"
        grep -Fq 'define { i32, double, i32 } @parse_record([10 x i32]' "${representative_llvm}"
        parser_llvm="$(awk '/^define .*@parse_record\(/ { capture=1 } capture { print } capture && /^}/ { exit }' "${representative_llvm}")"
        parser_lower_count="$(printf '%s\n' "${parser_llvm}" | grep -Fc 'fcmp oge double' || true)"
        parser_upper_count="$(printf '%s\n' "${parser_llvm}" | grep -Fc 'fcmp olt double' || true)"
        parser_trap_count="$(printf '%s\n' "${parser_llvm}" | grep -Fc 'call void @llvm.trap()' || true)"
        parser_gep_count="$(printf '%s\n' "${parser_llvm}" | grep -Fc 'getelementptr inbounds [10 x i32]' || true)"
        if test "${parser_lower_count}" -ne 10 \
          || test "${parser_upper_count}" -ne 10 \
          || test "${parser_trap_count}" -ne 10 \
          || test "${parser_gep_count}" -ne 10; then
          echo "representative parser LLVM did not contain exactly ten guarded character reads"
          exit 1
        fi
        if grep -Fq '[10 x double]' "${representative_llvm}" \
          || grep -Fq 'sitofp i32 %aero.arg.character' "${representative_llvm}"; then
          echo "representative parser retained a forbidden numeric character array lane"
          exit 1
        fi
        if grep -E '@printf\([^\n]*, i64 ' "${representative_llvm}"; then
          echo "representative telemetry LLVM rewrote a numeric printf argument to i64"
          exit 1
        fi
        opt-22 -passes=verify -disable-output "${representative_llvm}"
        llc-22 -verify-machineinstrs "${representative_llvm}" -o "${representative_machine}"
        clang-22 -O0 -no-pie "${representative_llvm}" -o "${representative_o0}"
        clang-22 -O2 -no-pie "${representative_llvm}" -o "${representative_o2}"

        set +e
        "${representative_o0}" > "${representative_o0}.stdout" 2> "${representative_o0}.stderr"
        representative_o0_exit=$?
        "${representative_o2}" > "${representative_o2}.stdout" 2> "${representative_o2}.stderr"
        representative_o2_exit=$?
        set -e
        printf 'telemetry score: 91\n' > "${RUNNER_TEMP}/representative_telemetry.expected"
        test "${representative_o0_exit}" -eq 91
        test "${representative_o2_exit}" -eq 91
        cmp -s "${representative_o0}.stdout" "${RUNNER_TEMP}/representative_telemetry.expected"
        cmp -s "${representative_o2}.stdout" "${RUNNER_TEMP}/representative_telemetry.expected"
        test ! -s "${representative_o0}.stderr"
        test ! -s "${representative_o2}.stderr"
        cmp -s "${representative_o0}.stdout" "${representative_o2}.stdout"
        cmp -s "${representative_o0}.stderr" "${representative_o2}.stderr"
        echo "representative telemetry test passed with exit code 91"

        for bounds_file in \
          negative_index.aero \
          upper_bound_index.aero \
          negative_write_index.aero \
          upper_bound_write_index.aero \
          generic_negative_index.aero \
          generic_upper_bound_index.aero \
          generic_negative_write_index.aero \
          generic_upper_bound_write_index.aero \
          projected_negative_index.aero \
          projected_upper_bound_index.aero \
          parser_negative_index.aero \
          parser_equal_to_count_index.aero; do
          bounds_case="${bounds_file%.aero}"
          bounds_source="${runtime_fail_root}/${bounds_file}"
          bounds_llvm="${RUNNER_TEMP}/${bounds_case}.ll"
          bounds_machine="${RUNNER_TEMP}/${bounds_case}.s"

          cargo run --locked --quiet -- check "${bounds_source}"
          cargo run --locked --quiet -- build "${bounds_source}" \
            -o "${bounds_llvm}" --require-llvm-verifier
          grep -Fq 'declare void @llvm.trap()' "${bounds_llvm}"
          grep -Fq 'fcmp oge double' "${bounds_llvm}"
          grep -Fq 'fcmp olt double' "${bounds_llvm}"
          opt-22 -passes=verify -disable-output "${bounds_llvm}"
          llc-22 -verify-machineinstrs "${bounds_llvm}" -o "${bounds_machine}"

          set +e
          public_bounds_output="$(cargo run --locked --quiet -- run "${bounds_source}" 2>&1)"
          public_bounds_exit=$?
          set -e
          printf '%s\n' "${public_bounds_output}"
          test "${public_bounds_exit}" -ne 0
          if printf '%s\n' "${public_bounds_output}" | grep -Fq 'unreachable '; then
            echo "public runtime bounds failure executed a post-access effect"
            exit 1
          fi

          for optimization in 0 2; do
            bounds_executable="${RUNNER_TEMP}/${bounds_case}.o${optimization}"
            clang-22 "-O${optimization}" -no-pie "${bounds_llvm}" -o "${bounds_executable}"
            set +e
            "${bounds_executable}" > "${bounds_executable}.stdout" 2> "${bounds_executable}.stderr"
            bounds_exit=$?
            set -e
            test "${bounds_exit}" -ne 0
            test ! -s "${bounds_executable}.stdout"
            test ! -s "${bounds_executable}.stderr"
          done
        done
        echo "runtime bounds failure corpus passed at O0 and O2"

    - name: Run tests
      run: cargo test --verbose
      working-directory: src/compiler

    - name: Run Clippy (correctness)
      run: cargo clippy --all-targets --all-features -- -D clippy::correctness
      working-directory: src/compiler

  windows-native:
    name: Windows LLVM 22 native system gate
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust stable for Windows
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable

    - name: Extract pinned LLVM 22.1.8 for Windows
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $archive = Join-Path $env:RUNNER_TEMP "clang+llvm-22.1.8-x86_64-pc-windows-msvc.tar.xz"
        $downloadUrl = "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/clang%2Bllvm-22.1.8-x86_64-pc-windows-msvc.tar.xz"
        curl.exe --fail --location --retry 3 --output $archive $downloadUrl
        if ($LASTEXITCODE -ne 0) {
          throw "official LLVM archive download failed with exit code $LASTEXITCODE"
        }
        $expectedSha256 = "d96c2cc1736f4eb7fa43cb9bbdf56d93551a9ae0a9aadb9c99c3c3b2b712a234"
        $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($actualSha256 -ne $expectedSha256) {
          throw "LLVM archive SHA-256 mismatch: expected $expectedSha256, got $actualSha256"
        }
        $llvmRoot = Join-Path $env:RUNNER_TEMP "llvm-22.1.8-archive"
        New-Item -ItemType Directory -Path $llvmRoot | Out-Null
        tar.exe -xf $archive -C $llvmRoot --strip-components=1
        if ($LASTEXITCODE -ne 0) {
          throw "official LLVM archive extraction failed with exit code $LASTEXITCODE"
        }
        $llvmBin = Join-Path $llvmRoot "bin"
        foreach ($tool in @("opt", "llvm-as", "llc", "clang")) {
          $toolPath = Join-Path $llvmBin "$tool.exe"
          if (-not (Test-Path -LiteralPath $toolPath -PathType Leaf)) {
            throw "official LLVM archive did not provide $toolPath"
          }
        }
        "LLVM_ROOT=$llvmRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Assert pinned Windows LLVM and Clang versions
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $llvmBin = Join-Path $env:LLVM_ROOT "bin"
        foreach ($tool in @("opt", "llvm-as", "llc", "clang")) {
          $toolPath = Join-Path $llvmBin "$tool.exe"
          $versionOutput = & $toolPath --version 2>&1
          if ($LASTEXITCODE -ne 0) {
            throw "$toolPath --version failed with exit code $LASTEXITCODE"
          }
          $versionText = $versionOutput -join "`n"
          Write-Host $versionText
          if ($versionText -notmatch "22\.1\.8") {
            throw "$toolPath did not report exact version 22.1.8"
          }
        }
        "AERO_LLVM_OPT=$llvmBin\opt.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "AERO_LLVM_AS=$llvmBin\llvm-as.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Build Aero compiler on Windows
      shell: pwsh
      run: cargo build --locked --manifest-path src/compiler/Cargo.toml

    - name: Confirm Windows LLVM 22 rejects known-invalid IR
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $false
        $invalidIr = Join-Path $env:RUNNER_TEMP "core078-known-invalid.ll"
        @(
          'define i32 @known_invalid() {'
          'entry:'
          '  ret i64 0'
          '}'
        ) | Set-Content -LiteralPath $invalidIr
        & "$env:LLVM_ROOT\bin\opt.exe" -passes=verify -disable-output $invalidIr
        $verifierExit = $LASTEXITCODE
        if ($verifierExit -eq 0) {
          throw "Windows opt accepted known-invalid LLVM IR"
        }
        Write-Host "Windows opt rejected the known-invalid LLVM IR fixture as required"
        $global:LASTEXITCODE = 0

    - name: Test invalid Windows build artifact hygiene
      shell: pwsh
      run: |
