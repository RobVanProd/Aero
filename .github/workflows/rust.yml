        if ([regex]::Matches($llvmText, '(?m)^declare i32 @aero_stdin_read_byte\(\)$').Count -ne 1 -or
            [regex]::Matches($llvmText, 'call i32 @aero_stdin_read_byte\(\)').Count -ne 1) {
          throw "Windows runtime-parser omitted its single runtime declaration/call"
        }

        & "$llvmBin\llvm-as.exe" $llvm -o $bitcode
        if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $bitcode -PathType Leaf) -or (Get-Item -LiteralPath $bitcode).Length -le 0) {
          throw "Windows runtime-parser bitcode verification failed"
        }
        & "$llvmBin\opt.exe" -passes=verify -disable-output $llvm
        if ($LASTEXITCODE -ne 0) {
          throw "Windows runtime-parser opt verification failed"
