        opt-22 -passes=verify -disable-output ../../static_string_equality.ll
        llc-22 -verify-machineinstrs ../../static_string_equality.ll -o /dev/null
        llc-22 -filetype=obj ../../static_string_equality.ll -o ../../static_string_equality.o
