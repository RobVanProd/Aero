        opt-22 -passes=verify -disable-output ../../static_string_len.ll
        llc-22 -verify-machineinstrs ../../static_string_len.ll -o /dev/null
        llc-22 -filetype=obj ../../static_string_len.ll -o ../../static_string_len.o
