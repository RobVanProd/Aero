        $executableO2 = Join-Path $env:RUNNER_TEMP "runtime_ascii_parser.o2.exe"
        [byte[]] $binaryInput = [Text.Encoding]::ASCII.GetBytes(
          "fn score()->int{return 1+2*3-4/2%2;}"
        )

        function Invoke-RuntimeAsciiParser([string] $FileName, [string[]] $Arguments) {
          $start = [System.Diagnostics.ProcessStartInfo]::new()
          $start.FileName = $FileName
          foreach ($argument in $Arguments) {
            [void] $start.ArgumentList.Add($argument)
          }
          $start.UseShellExecute = $false
          $start.CreateNoWindow = $true
          $start.RedirectStandardInput = $true
          $start.RedirectStandardOutput = $true
          $start.RedirectStandardError = $true
          $process = [System.Diagnostics.Process]::new()
          $process.StartInfo = $start
          if (-not $process.Start()) {
            throw "failed to start $FileName"
          }
          $stdout = $process.StandardOutput.ReadToEndAsync()
          $stderr = $process.StandardError.ReadToEndAsync()
          $process.StandardInput.BaseStream.Write($binaryInput, 0, $binaryInput.Length)
          $process.StandardInput.Close()
          $process.WaitForExit()
          [pscustomobject]@{
            ExitCode = $process.ExitCode
            Stdout = $stdout.Result
            Stderr = $stderr.Result
