        cargo run --locked --manifest-path src/compiler/Cargo.toml -- check examples/balanced_loop_enum_ownership/main.aero
        if ($LASTEXITCODE -ne 0) {
          throw "Windows public check failed with exit code $LASTEXITCODE"
        }
        cargo run --locked --manifest-path src/compiler/Cargo.toml -- build $example -o $llvmPath --require-llvm-verifier
        if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $llvmPath)) {
          throw "Windows public build failed or omitted its LLVM artifact"
        }

        $llvmText = Get-Content -LiteralPath $llvmPath -Raw
        if (-not $llvmText.Contains('target triple = "x86_64-pc-windows-msvc"')) {
          throw "Windows LLVM omitted the frozen x86_64 MSVC triple"
        }
        if (-not $llvmText.Contains('target datalayout = "e-m:w-p270:32:32-p271:32:32-p272:64:64-i64:64-i128:128-f80:128-n8:16:32:64-S128"')) {
          throw "Windows LLVM omitted the frozen x86_64 MSVC data layout"
        }

        & "$llvmBin\opt.exe" -passes=verify -disable-output $llvmPath
        if ($LASTEXITCODE -ne 0) {
          throw "Windows opt verification failed with exit code $LASTEXITCODE"
        }
        & "$llvmBin\llc.exe" -verify-machineinstrs $llvmPath -o $machinePath
        if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $machinePath)) {
          throw "Windows machine verification failed or omitted assembly"
        }
        & "$llvmBin\llc.exe" -filetype=obj $llvmPath -o $objectPath
        if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $objectPath)) {
          throw "Windows object generation failed or omitted its COFF object"
        }
        & "$llvmBin\clang.exe" $objectPath -o $executablePath
        if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $executablePath)) {
          throw "Windows Clang/MSVC link failed or omitted its executable"
        }

        cargo run --locked --manifest-path src/compiler/Cargo.toml -- run examples/balanced_loop_enum_ownership/main.aero
        $publicRunExit = $LASTEXITCODE
        if ($publicRunExit -ne 227) {
          throw "Windows public run returned $publicRunExit, expected 227"
        }
        Write-Host "Windows public run passed with exit code 227"

        & $executablePath
        $manualExit = $LASTEXITCODE
        if ($manualExit -ne 227) {
          throw "Windows manual native execution returned $manualExit, expected 227"
        }
        Write-Host "Windows manual native execution passed with exit code 227"
        $global:LASTEXITCODE = 0

