    - name: Test monomorphic scalar struct integration example
      run: |
        cd src/compiler
        cargo run -- build ../../examples/monomorphic_scalar_structs.aero -o ../../monomorphic_scalar_structs.ll
        opt-22 -passes=verify -disable-output ../../monomorphic_scalar_structs.ll
