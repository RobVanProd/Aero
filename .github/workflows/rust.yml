name: Rust CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  CARGO_TERM_COLOR: always
  AERO_LLVM_OPT: /usr/bin/opt-22
  AERO_LLVM_AS: /usr/bin/llvm-as-22
  AERO_REQUIRE_LLVM_VERIFIER: "true"

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        rust: [stable, nightly]

    steps:
    - uses: actions/checkout@v4
    - name: Install Rust ${{ matrix.rust }}
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
        components: clippy, rustfmt

    - name: Build
      run: cargo build --verbose
      working-directory: src/compiler

    - name: Install pinned LLVM 22 + Clang 22
      run: |
        sudo install -m 0755 -d /etc/apt/keyrings
        curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
          | sudo gpg --dearmor --yes -o /etc/apt/keyrings/apt.llvm.org.gpg
        . /etc/os-release
        echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.gpg] http://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-22 main" \
          | sudo tee /etc/apt/sources.list.d/llvm-22.list
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends llvm-22 clang-22
        opt-22 --version
        llvm-as-22 --version
        llc-22 --version
        clang-22 --version

    - name: Verify documented Quick Start
      if: matrix.rust == 'stable'
      shell: bash
      run: |
        export PATH="/usr/lib/llvm-22/bin:${PATH}"
        test "$(command -v clang)" = "/usr/lib/llvm-22/bin/clang"
        test "$(command -v llc)" = "/usr/lib/llvm-22/bin/llc"
        clang --version | grep -Eq 'clang version 22\.'
        llc --version | grep -Eq 'LLVM version 22\.'
        test "${AERO_LLVM_OPT}" = "/usr/bin/opt-22"
        test "${AERO_LLVM_AS}" = "/usr/bin/llvm-as-22"
        cargo build --release --manifest-path src/compiler/Cargo.toml
        export PATH="${GITHUB_WORKSPACE}/src/compiler/target/release:${PATH}"
        aero --version
        quick_start_root="$(mktemp -d)"
        cd "${quick_start_root}"
        aero init my_app
        cd my_app
        aero check src/main.aero
        set +e
        run_output="$(aero run src/main.aero)"
        run_status=$?
        set -e
        printf '%s\n' "${run_output}"
        test "${run_status}" -eq 0
        output_count="$(printf '%s\n' "${run_output}" | grep -c '^Output: Hello, Aero!$' || true)"
        test "${output_count}" -eq 1

    - name: Confirm LLVM 22 rejects known-invalid IR
      if: matrix.rust == 'stable'
      shell: bash
      run: |
        invalid_ir="${RUNNER_TEMP}/aero-known-invalid.ll"
        printf '%s\n' \
          'define i32 @known_invalid() {' \
          'entry:' \
          '  ret i64 0' \
          '}' > "${invalid_ir}"
        if opt-22 -passes=verify -disable-output "${invalid_ir}"; then
          echo "opt-22 accepted known-invalid LLVM IR"
          exit 1
        fi
        echo "opt-22 rejected the known-invalid LLVM IR fixture as required"

    - name: Test return15 example
      run: |
        cd src/compiler
        cargo run -- build ../../examples/return15.aero -o ../../return15.ll
        opt-22 -passes=verify -disable-output ../../return15.ll
        llc-22 -verify-machineinstrs ../../return15.ll -o /dev/null
        llc-22 -filetype=obj ../../return15.ll -o ../../return15.o
        clang-22 ../../return15.o -o ../../return15
        set +e
        ../../return15
        exit_code=$?
        set -e
        if [ $exit_code -ne 15 ]; then
          echo "Expected exit code 15, got $exit_code"
          exit 1
        fi
        echo "return15 test passed with exit code $exit_code"

    - name: Test variables example
      run: |
        cd src/compiler
        cargo run -- build ../../examples/variables.aero -o ../../variables.ll
        opt-22 -passes=verify -disable-output ../../variables.ll
        llc-22 -verify-machineinstrs ../../variables.ll -o /dev/null
        llc-22 -filetype=obj ../../variables.ll -o ../../variables.o
        clang-22 ../../variables.o -o ../../variables
        set +e
        ../../variables
        exit_code=$?
        set -e
        if [ $exit_code -ne 6 ]; then
          echo "Expected exit code 6, got $exit_code"
          exit 1
        fi
    - name: Test mixed arithmetic example
      run: |
        cd src/compiler
        cargo run -- build ../../examples/mixed.aero -o ../../mixed.ll
        opt-22 -passes=verify -disable-output ../../mixed.ll
        llc-22 -verify-machineinstrs ../../mixed.ll -o /dev/null
        llc-22 -filetype=obj ../../mixed.ll -o ../../mixed.o
        clang-22 ../../mixed.o -o ../../mixed
        set +e
