        cargo run --locked --quiet --manifest-path src/compiler/Cargo.toml -- check $example
        if ($LASTEXITCODE -ne 0) {
          throw "Windows representative telemetry public check failed with exit code $LASTEXITCODE"
        }
        $publicOutput = @(cargo run --locked --quiet --manifest-path src/compiler/Cargo.toml -- run $example 2>&1)
        $publicExit = $LASTEXITCODE
        $publicOutput | ForEach-Object { Write-Host $_ }
        if ($publicExit -ne 91) {
          throw "Windows representative telemetry public run returned $publicExit, expected 91"
        }
        $publicOutputCount = @($publicOutput | Where-Object { $_.ToString() -ceq "Output: telemetry score: 91" }).Count
        if ($publicOutputCount -ne 1) {
          throw "Windows representative telemetry public run omitted its exact output line"
        }

        cargo run --locked --quiet --manifest-path src/compiler/Cargo.toml -- build $example -o $representativeLlvm --require-llvm-verifier
        if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $representativeLlvm -PathType Leaf)) {
          throw "Windows representative telemetry public build failed or omitted its LLVM artifact"
        }
        $representativeText = Get-Content -LiteralPath $representativeLlvm -Raw
        if (-not $representativeText.Contains("call i32 (i8*, ...) @printf(")) {
          throw "Windows representative telemetry LLVM omitted the explicit variadic printf call type"
        }
        if (-not $representativeText.Contains("; Aero generic enum: Sample<Reading<int>>")) {
          throw "Windows representative telemetry LLVM omitted Sample<Reading<int>>"
        }
        if (-not $representativeText.Contains("; Aero generic enum: Sample<char>")) {
          throw "Windows representative telemetry LLVM omitted Sample<char>"
        }
        if (-not $representativeText.Contains("aero.trait.PolicyValue.for.Sensor.policy_value")) {
          throw "Windows representative telemetry LLVM omitted PolicyValue for Sensor"
        }
        if (-not $representativeText.Contains("aero.trait.PolicyValue.for.Batch.policy_value")) {
          throw "Windows representative telemetry LLVM omitted PolicyValue for Batch"
        }
        if (-not $representativeText.Contains("aero.generic.window_get<int>")) {
          throw "Windows representative telemetry LLVM omitted window_get<int>"
        }
        if (-not $representativeText.Contains("aero.generic.window_get<char>")) {
          throw "Windows representative telemetry LLVM omitted window_get<char>"
        }
        if (-not $representativeText.Contains("aero.generic.window_set<int>")) {
          throw "Windows representative telemetry LLVM omitted window_set<int>"
        }
        if (-not $representativeText.Contains("aero.generic.window_set<char>")) {
          throw "Windows representative telemetry LLVM omitted window_set<char>"
        }
        if (-not $representativeText.Contains("define { i32, double, i32 } @parse_record([10 x i32]")) {
          throw "Windows representative telemetry LLVM omitted the fixed character-record parser"
        }
        $parserMatch = [regex]::Match(
          $representativeText,
          '(?ms)^define \{ i32, double, i32 \} @parse_record\([^\r\n]*\).*?^\}'
        )
        if (-not $parserMatch.Success) {
          throw "Windows representative telemetry LLVM could not isolate the fixed character-record parser"
        }
        $parserText = $parserMatch.Value
        $parserCounts = @(
          ([regex]::Matches($parserText, [regex]::Escape("fcmp oge double"))).Count,
          ([regex]::Matches($parserText, [regex]::Escape("fcmp olt double"))).Count,
          ([regex]::Matches($parserText, [regex]::Escape("call void @llvm.trap()"))).Count,
          ([regex]::Matches($parserText, [regex]::Escape("getelementptr inbounds [10 x i32]"))).Count
        )
        if (@($parserCounts | Where-Object { $_ -ne 10 }).Count -ne 0) {
          throw "representative parser LLVM did not contain exactly ten guarded character reads"
        }
        if ($representativeText.Contains("[10 x double]") -or $representativeText.Contains("sitofp i32 %aero.arg.character")) {
          throw "representative parser retained a forbidden numeric character array lane"
        }
        if ($representativeText -match '@printf\([^\r\n]*, i64 ') {
          throw "Windows representative telemetry LLVM rewrote a numeric printf argument to i64"
        }

        & "$llvmBin\opt.exe" -passes=verify -disable-output $representativeLlvm
        if ($LASTEXITCODE -ne 0) {
          throw "Windows representative telemetry opt verification failed with exit code $LASTEXITCODE"
        }
        & "$llvmBin\llc.exe" -verify-machineinstrs $representativeLlvm -o $representativeMachine
        if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $representativeMachine -PathType Leaf)) {
          throw "Windows representative telemetry machine verification failed or omitted assembly"
        }
        & "$llvmBin\clang.exe" -O0 $representativeLlvm -o $representativeO0
        if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $representativeO0 -PathType Leaf)) {
          throw "Windows representative telemetry O0 link failed or omitted its executable"
        }
        & "$llvmBin\clang.exe" -O2 $representativeLlvm -o $representativeO2
        if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $representativeO2 -PathType Leaf)) {
          throw "Windows representative telemetry O2 link failed or omitted its executable"
        }

        function Invoke-RepresentativeTelemetry([string] $Path) {
          $start = [System.Diagnostics.ProcessStartInfo]::new()
          $start.FileName = $Path
          $start.UseShellExecute = $false
          $start.RedirectStandardOutput = $true
          $start.RedirectStandardError = $true
          $process = [System.Diagnostics.Process]::new()
          $process.StartInfo = $start
          if (-not $process.Start()) {
            throw "failed to start $Path"
          }
          $stdout = $process.StandardOutput.ReadToEndAsync()
          $stderr = $process.StandardError.ReadToEndAsync()
          $process.WaitForExit()
          [pscustomobject]@{
            ExitCode = $process.ExitCode
            Stdout = $stdout.Result
            Stderr = $stderr.Result
          }
        }

        $o0Result = Invoke-RepresentativeTelemetry $representativeO0
        $o2Result = Invoke-RepresentativeTelemetry $representativeO2
        $expectedOutput = "telemetry score: 91$([Environment]::NewLine)"
        foreach ($result in @($o0Result, $o2Result)) {
          if ($result.ExitCode -ne 91) {
            throw "Windows representative telemetry native run returned $($result.ExitCode), expected 91"
          }
          if ($result.Stdout -cne $expectedOutput) {
            throw "Windows representative telemetry native stdout was not exact: $($result.Stdout)"
          }
          if ($result.Stderr -cne "") {
            throw "Windows representative telemetry native stderr was not empty: $($result.Stderr)"
          }
        }
        if ($o0Result.Stdout -cne $o2Result.Stdout -or $o0Result.Stderr -cne $o2Result.Stderr -or $o0Result.ExitCode -ne $o2Result.ExitCode) {
          throw "Windows representative telemetry O0 and O2 behavior diverged"
        }
        Write-Host "representative telemetry test passed with exit code 91"

        foreach ($boundsFile in @(
          "negative_index.aero",
          "upper_bound_index.aero",
          "negative_write_index.aero",
          "upper_bound_write_index.aero",
          "generic_negative_index.aero",
          "generic_upper_bound_index.aero",
          "generic_negative_write_index.aero",
          "generic_upper_bound_write_index.aero",
          "projected_negative_index.aero",
          "projected_upper_bound_index.aero",
          "parser_negative_index.aero",
          "parser_equal_to_count_index.aero"
        )) {
          $boundsCase = [System.IO.Path]::GetFileNameWithoutExtension($boundsFile)
          $boundsSource = Join-Path $runtimeFailRoot $boundsFile
          $boundsLlvm = Join-Path $env:RUNNER_TEMP "$boundsCase.windows.ll"
          $boundsMachine = Join-Path $env:RUNNER_TEMP "$boundsCase.windows.s"

          cargo run --locked --quiet --manifest-path src/compiler/Cargo.toml -- check $boundsSource
          if ($LASTEXITCODE -ne 0) {
            throw "Windows $boundsCase public check failed with exit code $LASTEXITCODE"
          }
          cargo run --locked --quiet --manifest-path src/compiler/Cargo.toml -- build $boundsSource -o $boundsLlvm --require-llvm-verifier
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $boundsLlvm -PathType Leaf)) {
            throw "Windows $boundsCase public build failed or omitted its LLVM artifact"
          }
          $boundsText = Get-Content -LiteralPath $boundsLlvm -Raw
          foreach ($anchor in @("declare void @llvm.trap()", "fcmp oge double", "fcmp olt double")) {
            if (-not $boundsText.Contains($anchor)) {
              throw "Windows $boundsCase LLVM omitted bounds anchor $anchor"
            }
          }
          & "$llvmBin\opt.exe" -passes=verify -disable-output $boundsLlvm
          if ($LASTEXITCODE -ne 0) {
            throw "Windows $boundsCase opt verification failed with exit code $LASTEXITCODE"
          }
          & "$llvmBin\llc.exe" -verify-machineinstrs $boundsLlvm -o $boundsMachine
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $boundsMachine -PathType Leaf)) {
            throw "Windows $boundsCase machine verification failed or omitted assembly"
          }

          $publicBoundsOutput = @(cargo run --locked --quiet --manifest-path src/compiler/Cargo.toml -- run $boundsSource 2>&1)
          $publicBoundsExit = $LASTEXITCODE
          $publicBoundsOutput | ForEach-Object { Write-Host $_ }
          if ($publicBoundsExit -eq 0) {
            throw "Windows $boundsCase public run falsely succeeded"
          }
          if (@($publicBoundsOutput | Where-Object { $_.ToString().Contains("unreachable ") }).Count -ne 0) {
            throw "Windows $boundsCase public run executed a post-access effect"
          }

          foreach ($optimization in @(0, 2)) {
            $boundsExecutable = Join-Path $env:RUNNER_TEMP "$boundsCase.o$optimization.exe"
            & "$llvmBin\clang.exe" "-O$optimization" $boundsLlvm -o $boundsExecutable
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $boundsExecutable -PathType Leaf)) {
              throw "Windows $boundsCase O$optimization link failed or omitted its executable"
            }
            $boundsResult = Invoke-RepresentativeTelemetry $boundsExecutable
            if ($boundsResult.ExitCode -eq 0) {
              throw "Windows $boundsCase O$optimization native run falsely succeeded"
            }
            if ($boundsResult.Stdout -cne "" -or $boundsResult.Stderr -cne "") {
              throw "Windows $boundsCase O$optimization executed a post-access effect"
            }
          }
        }
        Write-Host "runtime bounds failure corpus passed at O0 and O2"
        exit 0
