    - name: Test representative telemetry application at O0 and O2
      if: matrix.rust == 'stable'
      shell: bash
      run: |
        export PATH="/usr/lib/llvm-22/bin:${PATH}"
        representative_source="../../examples/representative_telemetry/main.aero"
        representative_llvm="${RUNNER_TEMP}/representative_telemetry.ll"
        representative_machine="${RUNNER_TEMP}/representative_telemetry.s"
        representative_o0="${RUNNER_TEMP}/representative_telemetry.o0"
        representative_o2="${RUNNER_TEMP}/representative_telemetry.o2"
        runtime_fail_root="../../examples/representative_telemetry/runtime_fail"
        cd src/compiler

        cargo run --locked --quiet -- check "${representative_source}"
        set +e
        public_run_output="$(cargo run --locked --quiet -- run "${representative_source}" 2>&1)"
        public_run_exit=$?
        set -e
        printf '%s\n' "${public_run_output}"
        test "${public_run_exit}" -eq 91
        public_output_count="$(printf '%s\n' "${public_run_output}" | grep -c '^Output: telemetry score: 91$' || true)"
        test "${public_output_count}" -eq 1

        cargo run --locked --quiet -- build "${representative_source}" \
          -o "${representative_llvm}" --require-llvm-verifier
        grep -Fq 'call i32 (i8*, ...) @printf(' "${representative_llvm}"
        grep -Fq '; Aero generic enum: Sample<Reading<int>>' "${representative_llvm}"
        grep -Fq '; Aero generic enum: Sample<char>' "${representative_llvm}"
        grep -Fq 'aero.trait.PolicyValue.for.Sensor.policy_value' "${representative_llvm}"
        grep -Fq 'aero.trait.PolicyValue.for.Batch.policy_value' "${representative_llvm}"
        grep -Fq 'aero.generic.window_get<int>' "${representative_llvm}"
        grep -Fq 'aero.generic.window_get<char>' "${representative_llvm}"
        grep -Fq 'aero.generic.window_set<int>' "${representative_llvm}"
        grep -Fq 'aero.generic.window_set<char>' "${representative_llvm}"
        grep -Fq 'define { i32, double, i32 } @parse_record([10 x i32]' "${representative_llvm}"
        parser_llvm="$(awk '/^define .*@parse_record\(/ { capture=1 } capture { print } capture && /^}/ { exit }' "${representative_llvm}")"
        parser_lower_count="$(printf '%s\n' "${parser_llvm}" | grep -Fc 'fcmp oge double' || true)"
        parser_upper_count="$(printf '%s\n' "${parser_llvm}" | grep -Fc 'fcmp olt double' || true)"
        parser_trap_count="$(printf '%s\n' "${parser_llvm}" | grep -Fc 'call void @llvm.trap()' || true)"
        parser_gep_count="$(printf '%s\n' "${parser_llvm}" | grep -Fc 'getelementptr inbounds [10 x i32]' || true)"
        if test "${parser_lower_count}" -ne 10 \
          || test "${parser_upper_count}" -ne 10 \
          || test "${parser_trap_count}" -ne 10 \
          || test "${parser_gep_count}" -ne 10; then
          echo "representative parser LLVM did not contain exactly ten guarded character reads"
          exit 1
        fi
        if grep -Fq '[10 x double]' "${representative_llvm}" \
          || grep -Fq 'sitofp i32 %aero.arg.character' "${representative_llvm}"; then
          echo "representative parser retained a forbidden numeric character array lane"
          exit 1
        fi
        if grep -E '@printf\([^\n]*, i64 ' "${representative_llvm}"; then
          echo "representative telemetry LLVM rewrote a numeric printf argument to i64"
          exit 1
        fi
        opt-22 -passes=verify -disable-output "${representative_llvm}"
        llc-22 -verify-machineinstrs "${representative_llvm}" -o "${representative_machine}"
        clang-22 -O0 -no-pie "${representative_llvm}" -o "${representative_o0}"
        clang-22 -O2 -no-pie "${representative_llvm}" -o "${representative_o2}"

        set +e
        "${representative_o0}" > "${representative_o0}.stdout" 2> "${representative_o0}.stderr"
        representative_o0_exit=$?
        "${representative_o2}" > "${representative_o2}.stdout" 2> "${representative_o2}.stderr"
        representative_o2_exit=$?
        set -e
        printf 'telemetry score: 91\n' > "${RUNNER_TEMP}/representative_telemetry.expected"
        test "${representative_o0_exit}" -eq 91
        test "${representative_o2_exit}" -eq 91
        cmp -s "${representative_o0}.stdout" "${RUNNER_TEMP}/representative_telemetry.expected"
        cmp -s "${representative_o2}.stdout" "${RUNNER_TEMP}/representative_telemetry.expected"
        test ! -s "${representative_o0}.stderr"
        test ! -s "${representative_o2}.stderr"
        cmp -s "${representative_o0}.stdout" "${representative_o2}.stdout"
        cmp -s "${representative_o0}.stderr" "${representative_o2}.stderr"
        echo "representative telemetry test passed with exit code 91"

        for bounds_file in \
          negative_index.aero \
          upper_bound_index.aero \
          negative_write_index.aero \
          upper_bound_write_index.aero \
          generic_negative_index.aero \
          generic_upper_bound_index.aero \
          generic_negative_write_index.aero \
          generic_upper_bound_write_index.aero \
          projected_negative_index.aero \
          projected_upper_bound_index.aero \
          parser_negative_index.aero \
          parser_equal_to_count_index.aero; do
          bounds_case="${bounds_file%.aero}"
          bounds_source="${runtime_fail_root}/${bounds_file}"
          bounds_llvm="${RUNNER_TEMP}/${bounds_case}.ll"
          bounds_machine="${RUNNER_TEMP}/${bounds_case}.s"

          cargo run --locked --quiet -- check "${bounds_source}"
          cargo run --locked --quiet -- build "${bounds_source}" \
            -o "${bounds_llvm}" --require-llvm-verifier
          grep -Fq 'declare void @llvm.trap()' "${bounds_llvm}"
          grep -Fq 'fcmp oge double' "${bounds_llvm}"
          grep -Fq 'fcmp olt double' "${bounds_llvm}"
          opt-22 -passes=verify -disable-output "${bounds_llvm}"
          llc-22 -verify-machineinstrs "${bounds_llvm}" -o "${bounds_machine}"

          set +e
          public_bounds_output="$(cargo run --locked --quiet -- run "${bounds_source}" 2>&1)"
          public_bounds_exit=$?
          set -e
          printf '%s\n' "${public_bounds_output}"
          test "${public_bounds_exit}" -ne 0
          if printf '%s\n' "${public_bounds_output}" | grep -Fq 'unreachable '; then
            echo "public runtime bounds failure executed a post-access effect"
            exit 1
          fi

          for optimization in 0 2; do
            bounds_executable="${RUNNER_TEMP}/${bounds_case}.o${optimization}"
            clang-22 "-O${optimization}" -no-pie "${bounds_llvm}" -o "${bounds_executable}"
            set +e
            "${bounds_executable}" > "${bounds_executable}.stdout" 2> "${bounds_executable}.stderr"
            bounds_exit=$?
            set -e
            test "${bounds_exit}" -ne 0
            test ! -s "${bounds_executable}.stdout"
            test ! -s "${bounds_executable}.stderr"
          done
        done
        echo "runtime bounds failure corpus passed at O0 and O2"

    - name: Run tests
      run: cargo test --verbose
      working-directory: src/compiler

    - name: Run Clippy (correctness)
      run: cargo clippy --all-targets --all-features -- -D clippy::correctness
      working-directory: src/compiler

  windows-native:
    name: Windows LLVM 22 native system gate
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust stable for Windows
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable

    - name: Extract pinned LLVM 22.1.8 for Windows
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $archive = Join-Path $env:RUNNER_TEMP "clang+llvm-22.1.8-x86_64-pc-windows-msvc.tar.xz"
        $downloadUrl = "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/clang%2Bllvm-22.1.8-x86_64-pc-windows-msvc.tar.xz"
        curl.exe --fail --location --retry 3 --output $archive $downloadUrl
        if ($LASTEXITCODE -ne 0) {
          throw "official LLVM archive download failed with exit code $LASTEXITCODE"
        }
        $expectedSha256 = "d96c2cc1736f4eb7fa43cb9bbdf56d93551a9ae0a9aadb9c99c3c3b2b712a234"
        $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($actualSha256 -ne $expectedSha256) {
          throw "LLVM archive SHA-256 mismatch: expected $expectedSha256, got $actualSha256"
        }
        $llvmRoot = Join-Path $env:RUNNER_TEMP "llvm-22.1.8-archive"
        New-Item -ItemType Directory -Path $llvmRoot | Out-Null
        tar.exe -xf $archive -C $llvmRoot --strip-components=1
        if ($LASTEXITCODE -ne 0) {
          throw "official LLVM archive extraction failed with exit code $LASTEXITCODE"
        }
        $llvmBin = Join-Path $llvmRoot "bin"
        foreach ($tool in @("opt", "llvm-as", "llc", "clang")) {
          $toolPath = Join-Path $llvmBin "$tool.exe"
          if (-not (Test-Path -LiteralPath $toolPath -PathType Leaf)) {
            throw "official LLVM archive did not provide $toolPath"
          }
        }
        "LLVM_ROOT=$llvmRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Assert pinned Windows LLVM and Clang versions
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $llvmBin = Join-Path $env:LLVM_ROOT "bin"
        foreach ($tool in @("opt", "llvm-as", "llc", "clang")) {
          $toolPath = Join-Path $llvmBin "$tool.exe"
          $versionOutput = & $toolPath --version 2>&1
          if ($LASTEXITCODE -ne 0) {
            throw "$toolPath --version failed with exit code $LASTEXITCODE"
          }
          $versionText = $versionOutput -join "`n"
          Write-Host $versionText
          if ($versionText -notmatch "22\.1\.8") {
            throw "$toolPath did not report exact version 22.1.8"
          }
        }
        "AERO_LLVM_OPT=$llvmBin\opt.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "AERO_LLVM_AS=$llvmBin\llvm-as.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

