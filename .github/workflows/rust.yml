          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $output -PathType Leaf)) {
            throw "Windows runtime-lexer public build failed or omitted LLVM"
          }
        }
        if (-not [System.Linq.Enumerable]::SequenceEqual([IO.File]::ReadAllBytes($llvm), [IO.File]::ReadAllBytes($repeatLlvm))) {
          throw "Windows runtime-lexer emitted nondeterministic LLVM"
        }
        $llvmText = Get-Content -LiteralPath $llvm -Raw
        if ([regex]::Matches($llvmText, '(?m)^declare i32 @aero_stdin_read_byte\(\)$').Count -ne 1 -or
            [regex]::Matches($llvmText, 'call i32 @aero_stdin_read_byte\(\)').Count -ne 1) {
          throw "Windows runtime-lexer omitted its single runtime declaration/call"
        }

        & "$llvmBin\llvm-as.exe" $llvm -o $bitcode
        if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $bitcode -PathType Leaf) -or (Get-Item -LiteralPath $bitcode).Length -le 0) {
          throw "Windows runtime-lexer bitcode verification failed"
        }
        & "$llvmBin\opt.exe" -passes=verify -disable-output $llvm
        if ($LASTEXITCODE -ne 0) {
          throw "Windows runtime-lexer opt verification failed"
        }
        & "$llvmBin\llc.exe" -verify-machineinstrs $llvm -o $machine
        if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $machine -PathType Leaf)) {
          throw "Windows runtime-lexer machine verification failed"
        }
        & "$llvmBin\clang.exe" -O0 $llvm $runtime -o $executableO0
        if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $executableO0 -PathType Leaf)) {
          throw "Windows runtime-lexer O0 link failed"
        }
        & "$llvmBin\clang.exe" -O2 $llvm $runtime -o $executableO2
        if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $executableO2 -PathType Leaf)) {
          throw "Windows runtime-lexer O2 link failed"
        }
        foreach ($executable in @($executableO0, $executableO2)) {
          $native = Invoke-RuntimeAsciiLexer $executable @()
          if ($native.ExitCode -ne 91 -or $native.Stdout -cne "" -or $native.Stderr -cne "") {
            throw "Windows runtime-lexer native behavior diverged"
          }
        }

        $public = Invoke-RuntimeAsciiLexer "cargo" @(
          "run", "--locked", "--quiet", "--manifest-path", "src/compiler/Cargo.toml", "--",
          "run", $source, "--language-profile", "exact-i32-byte-input-v0"
        )
        $publicText = $public.Stdout + $public.Stderr
        $publicText | Write-Host
        if ($public.ExitCode -ne 91) {
          throw "Windows runtime-lexer public run returned $($public.ExitCode)"
        }
        if (@($publicText -split "`r?`n" | Where-Object { $_ -ceq "Exit code: 91" }).Count -ne 1) {
          throw "Windows runtime-lexer public run omitted its exact exit line"
        }
        if (@($publicText -split "`r?`n" | Where-Object { $_ -match '^(Output|Error output):' }).Count -ne 0) {
          throw "Windows runtime-lexer application emitted output"
        }
        exit 0

