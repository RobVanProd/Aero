        )

        foreach ($specimen in $specimens) {
          $source = "examples/stable_scalar_v0/$($specimen.File)"
          $llvm = Join-Path $env:RUNNER_TEMP "stable_scalar_$($specimen.Name).windows.ll"
          $machine = Join-Path $env:RUNNER_TEMP "stable_scalar_$($specimen.Name).windows.s"
          $executableO0 = Join-Path $env:RUNNER_TEMP "stable_scalar_$($specimen.Name).o0.exe"
          $executableO2 = Join-Path $env:RUNNER_TEMP "stable_scalar_$($specimen.Name).o2.exe"

          cargo run --locked --quiet --manifest-path src/compiler/Cargo.toml -- check $source --language-profile stable-scalar-v0
          if ($LASTEXITCODE -ne 0) {
            throw "Windows stable-scalar-v0 $($specimen.Name) public check failed"
          }
          cargo run --locked --quiet --manifest-path src/compiler/Cargo.toml -- build $source -o $llvm --require-llvm-verifier --language-profile stable-scalar-v0
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $llvm -PathType Leaf)) {
            throw "Windows stable-scalar-v0 $($specimen.Name) public build failed or omitted LLVM"
          }

          $llvmText = Get-Content -LiteralPath $llvm -Raw
          if (-not $llvmText.Contains("alloca i32, align 4")) {
            throw "Windows stable-scalar-v0 $($specimen.Name) omitted its exact i32 storage lane"
          }
          if ($llvmText -match 'double|fptosi|sitofp| nsw | nuw ') {
            throw "Windows stable-scalar-v0 $($specimen.Name) leaked an excluded LLVM numeric lane or overflow promise"
          }

          & "$llvmBin\opt.exe" -passes=verify -disable-output $llvm
          if ($LASTEXITCODE -ne 0) {
            throw "Windows stable-scalar-v0 $($specimen.Name) opt verification failed"
          }
          & "$llvmBin\llc.exe" -verify-machineinstrs $llvm -o $machine
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $machine -PathType Leaf)) {
            throw "Windows stable-scalar-v0 $($specimen.Name) machine verification failed"
          }
          & "$llvmBin\clang.exe" -O0 $llvm -o $executableO0
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $executableO0 -PathType Leaf)) {
            throw "Windows stable-scalar-v0 $($specimen.Name) O0 link failed"
          }
          & "$llvmBin\clang.exe" -O2 $llvm -o $executableO2
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $executableO2 -PathType Leaf)) {
            throw "Windows stable-scalar-v0 $($specimen.Name) O2 link failed"
          }

          foreach ($executable in @($executableO0, $executableO2)) {
            $nativeOutput = @(& $executable 2>&1)
            $nativeStatus = $LASTEXITCODE
            if ($nativeStatus -ne $specimen.Expected) {
              throw "Windows stable-scalar-v0 $($specimen.Name) native exit was $nativeStatus, expected $($specimen.Expected)"
            }
            if ($nativeOutput.Count -ne 0) {
              throw "Windows stable-scalar-v0 $($specimen.Name) native execution produced unexpected output"
            }
          }

          $publicOutput = @(cargo run --locked --quiet --manifest-path src/compiler/Cargo.toml -- run $source --language-profile stable-scalar-v0 2>&1)
          $publicStatus = $LASTEXITCODE
          $publicOutput | ForEach-Object { Write-Host $_ }
          if ($publicStatus -ne $specimen.Expected) {
            throw "Windows stable-scalar-v0 $($specimen.Name) public run returned $publicStatus, expected $($specimen.Expected)"
          }
          if (@($publicOutput | Where-Object { $_.ToString() -ceq "Exit code: $($specimen.Expected)" }).Count -ne 1) {
            throw "Windows stable-scalar-v0 $($specimen.Name) public run omitted its exact exit line"
          }
        }
        $global:LASTEXITCODE = 0

    - name: Test exact i32 fixed-array CPU profile on Windows at O0 and O2
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $PSNativeCommandUseErrorActionPreference = $false
        $env:AERO_REQUIRE_LLVM_VERIFIER = "true"
        $llvmBin = Join-Path $env:LLVM_ROOT "bin"

        function Invoke-ExactI32Array([string] $Path) {
          $start = [System.Diagnostics.ProcessStartInfo]::new()
          $start.FileName = $Path
          $start.UseShellExecute = $false
          $start.RedirectStandardOutput = $true
          $start.RedirectStandardError = $true
          $process = [System.Diagnostics.Process]::new()
          $process.StartInfo = $start
          if (-not $process.Start()) {
            throw "failed to start $Path"
          }
          $stdout = $process.StandardOutput.ReadToEndAsync()
          $stderr = $process.StandardError.ReadToEndAsync()
          $process.WaitForExit()
          [pscustomobject]@{
            ExitCode = $process.ExitCode
            Stdout = $stdout.Result
            Stderr = $stderr.Result
          }
        }

        $specimens = @(
          [pscustomobject]@{ Name = "kernel"; File = "main.aero"; Expected = 91; Dynamic = $true },
          [pscustomobject]@{ Name = "wrapping"; File = "wrapping_edges.aero"; Expected = 93; Dynamic = $false }
        )
        foreach ($specimen in $specimens) {
          $source = "examples/fixed_int_array_v0/$($specimen.File)"
          $llvm = Join-Path $env:RUNNER_TEMP "exact_i32_array_$($specimen.Name).windows.ll"
          $machine = Join-Path $env:RUNNER_TEMP "exact_i32_array_$($specimen.Name).windows.s"
          $executableO0 = Join-Path $env:RUNNER_TEMP "exact_i32_array_$($specimen.Name).o0.exe"
          $executableO2 = Join-Path $env:RUNNER_TEMP "exact_i32_array_$($specimen.Name).o2.exe"

          cargo run --locked --quiet --manifest-path src/compiler/Cargo.toml -- check $source --language-profile exact-i32-array-v0
          if ($LASTEXITCODE -ne 0) {
            throw "Windows exact-i32-array-v0 $($specimen.Name) public check failed"
          }
          cargo run --locked --quiet --manifest-path src/compiler/Cargo.toml -- build $source -o $llvm --require-llvm-verifier --language-profile exact-i32-array-v0
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $llvm -PathType Leaf)) {
            throw "Windows exact-i32-array-v0 $($specimen.Name) public build failed or omitted LLVM"
          }

          $llvmText = Get-Content -LiteralPath $llvm -Raw
          if (-not $llvmText.Contains(" x i32]") -or -not $llvmText.Contains("getelementptr inbounds [")) {
            throw "Windows exact-i32-array-v0 $($specimen.Name) omitted its typed fixed-array lane"
          }
          if ($llvmText -match 'double|fptosi|sitofp| nsw | nuw | x i8\]|<[^>]* x i32>') {
            throw "Windows exact-i32-array-v0 $($specimen.Name) leaked an excluded representation or overflow promise"
          }
          if ($specimen.Name -ceq "kernel") {
            foreach ($anchor in @(
              "define [8 x i32] @increment_each_lane([8 x i32] %aero.arg.values)",
              "define [8 x i32] @forward_array([8 x i32] %aero.arg.values)",
              "call [8 x i32] @increment_each_lane([8 x i32]",
              "call [8 x i32] @forward_array([8 x i32]",
              "ret [8 x i32]"
            )) {
              if (-not $llvmText.Contains($anchor)) {
                throw "Windows exact-i32-array-v0 kernel omitted exact array-value anchor $anchor"
              }
            }
            $kernelMutationPattern = '(?ms)^  (?<kernel_lower>%reg[0-9]+) = icmp sge i32 (?<kernel_index>%reg[0-9]+), 0\r?\n  (?<kernel_upper>%reg[0-9]+) = icmp slt i32 \k<kernel_index>, 8\r?\n  (?<kernel_inbounds>%reg[0-9]+) = and i1 \k<kernel_lower>, \k<kernel_upper>\r?\n  br i1 \k<kernel_inbounds>, label %aero\.bounds\.safe\.(?<kernel_place>[0-9]+), label %aero\.bounds\.trap\.\k<kernel_place>\r?\naero\.bounds\.trap\.\k<kernel_place>:\r?\n  call void @llvm\.trap\(\)\r?\n  unreachable\r?\naero\.bounds\.safe\.\k<kernel_place>:\r?\n  (?<kernel_extended>%reg[0-9]+) = sext i32 \k<kernel_index> to i64\r?\n  (?<kernel_target>%ptr[0-9]+) = getelementptr inbounds \[8 x i32\], \[8 x i32\]\* %ptr[0-9]+, i64 0, i64 \k<kernel_extended>\r?\n(?:(?!^\}).)*?^  store i32 [^,\r\n]+, i32\* \k<kernel_target>, align 4\r?$'
            $kernelMutationMatches = [regex]::Matches($llvmText, $kernelMutationPattern)
            if ($kernelMutationMatches.Count -ne 1) {
              throw "Windows exact-i32-array-v0 kernel omitted its identity-linked guarded mutable store"
            }
          }
          if ($specimen.Dynamic) {
            $guardPattern = '(?m)^  (?<lower>%reg[0-9]+) = icmp sge i32 (?<index>%reg[0-9]+), 0\r?\n  (?<upper>%reg[0-9]+) = icmp slt i32 \k<index>, [0-9]+\r?\n  (?<inbounds>%reg[0-9]+) = and i1 \k<lower>, \k<upper>\r?\n  br i1 \k<inbounds>, label %aero\.bounds\.safe\.(?<place>[0-9]+), label %aero\.bounds\.trap\.\k<place>\r?\naero\.bounds\.trap\.\k<place>:\r?\n  call void @llvm\.trap\(\)\r?\n  unreachable\r?\naero\.bounds\.safe\.\k<place>:\r?\n  (?<extended>%reg[0-9]+) = sext i32 \k<index> to i64\r?\n  %ptr[0-9]+ = getelementptr inbounds (?<aggregate>\[[0-9]+ x i32\]), \k<aggregate>\* %ptr[0-9]+, i64 0, i64 \k<extended>\r?$'
            $guardMatches = [regex]::Matches($llvmText, $guardPattern)
            if ($guardMatches.Count -ne 4) {
              throw "Windows exact-i32-array-v0 expected four identity-linked dynamic guard/address blocks"
            }
          } elseif ($llvmText -match 'icmp sge i32|call void @llvm\.trap\(\)|sext i32') {
            throw "Windows exact-i32-array-v0 wrapping specimen unexpectedly gained dynamic bounds IR"
          }

          & "$llvmBin\opt.exe" -passes=verify -disable-output $llvm
          if ($LASTEXITCODE -ne 0) {
            throw "Windows exact-i32-array-v0 $($specimen.Name) opt verification failed"
          }
          & "$llvmBin\llc.exe" -verify-machineinstrs $llvm -o $machine
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $machine -PathType Leaf)) {
            throw "Windows exact-i32-array-v0 $($specimen.Name) machine verification failed"
          }
          & "$llvmBin\clang.exe" -O0 $llvm -o $executableO0
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $executableO0 -PathType Leaf)) {
            throw "Windows exact-i32-array-v0 $($specimen.Name) O0 link failed"
          }
          & "$llvmBin\clang.exe" -O2 $llvm -o $executableO2
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $executableO2 -PathType Leaf)) {
            throw "Windows exact-i32-array-v0 $($specimen.Name) O2 link failed"
          }

          foreach ($executable in @($executableO0, $executableO2)) {
            $native = Invoke-ExactI32Array $executable
            if ($native.ExitCode -ne $specimen.Expected -or $native.Stdout -cne "" -or $native.Stderr -cne "") {
              throw "Windows exact-i32-array-v0 $($specimen.Name) native behavior diverged"
            }
          }

          $publicOutput = @(cargo run --locked --quiet --manifest-path src/compiler/Cargo.toml -- run $source --language-profile exact-i32-array-v0 2>&1)
          $publicStatus = $LASTEXITCODE
          $publicOutput | ForEach-Object { Write-Host $_ }
          if ($publicStatus -ne $specimen.Expected) {
            throw "Windows exact-i32-array-v0 $($specimen.Name) public run returned $publicStatus"
          }
          if (@($publicOutput | Where-Object { $_.ToString() -ceq "Exit code: $($specimen.Expected)" }).Count -ne 1) {
            throw "Windows exact-i32-array-v0 $($specimen.Name) public run omitted its exact exit line"
          }
        }

        foreach ($boundsFile in @("negative_index.aero", "equal_to_count_index.aero", "negative_write_index.aero", "equal_to_count_write_index.aero")) {
          $boundsCase = [System.IO.Path]::GetFileNameWithoutExtension($boundsFile)
          $boundsSource = "examples/fixed_int_array_v0/runtime_fail/$boundsFile"
          $boundsLlvm = Join-Path $env:RUNNER_TEMP "exact_i32_array_$boundsCase.windows.ll"
          $boundsMachine = Join-Path $env:RUNNER_TEMP "exact_i32_array_$boundsCase.windows.s"

          cargo run --locked --quiet --manifest-path src/compiler/Cargo.toml -- check $boundsSource --language-profile exact-i32-array-v0
          if ($LASTEXITCODE -ne 0) {
            throw "Windows exact-i32-array-v0 $boundsCase public check failed"
          }
          cargo run --locked --quiet --manifest-path src/compiler/Cargo.toml -- build $boundsSource -o $boundsLlvm --require-llvm-verifier --language-profile exact-i32-array-v0
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $boundsLlvm -PathType Leaf)) {
            throw "Windows exact-i32-array-v0 $boundsCase public build failed"
          }
          $boundsText = Get-Content -LiteralPath $boundsLlvm -Raw
          foreach ($anchor in @("declare void @llvm.trap()", "icmp sge i32", "icmp slt i32", "sext i32")) {
            if (-not $boundsText.Contains($anchor)) {
              throw "Windows exact-i32-array-v0 $boundsCase omitted $anchor"
            }
          }
          if ($boundsCase.EndsWith("_write_index", [System.StringComparison]::Ordinal)) {
            $boundsWritePattern = '(?m)^  (?<bounds_write_lower>%reg[0-9]+) = icmp sge i32 (?<bounds_write_index>%reg[0-9]+), 0\r?\n  (?<bounds_write_upper>%reg[0-9]+) = icmp slt i32 \k<bounds_write_index>, 2\r?\n  (?<bounds_write_inbounds>%reg[0-9]+) = and i1 \k<bounds_write_lower>, \k<bounds_write_upper>\r?\n  br i1 \k<bounds_write_inbounds>, label %aero\.bounds\.safe\.(?<bounds_write_place>[0-9]+), label %aero\.bounds\.trap\.\k<bounds_write_place>\r?\naero\.bounds\.trap\.\k<bounds_write_place>:\r?\n  call void @llvm\.trap\(\)\r?\n  unreachable\r?\naero\.bounds\.safe\.\k<bounds_write_place>:\r?\n  (?<bounds_write_extended>%reg[0-9]+) = sext i32 \k<bounds_write_index> to i64\r?\n  (?<bounds_write_target>%ptr[0-9]+) = getelementptr inbounds \[2 x i32\], \[2 x i32\]\* %ptr[0-9]+, i64 0, i64 \k<bounds_write_extended>\r?\n  store i32 9, i32\* \k<bounds_write_target>, align 4\r?$'
            $boundsWriteMatches = [regex]::Matches($boundsText, $boundsWritePattern)
            if ($boundsWriteMatches.Count -ne 1) {
              throw "Windows exact-i32-array-v0 $boundsCase omitted its identity-linked guarded mutable store"
            }
          }
          & "$llvmBin\opt.exe" -passes=verify -disable-output $boundsLlvm
          if ($LASTEXITCODE -ne 0) {
            throw "Windows exact-i32-array-v0 $boundsCase opt verification failed"
          }
          & "$llvmBin\llc.exe" -verify-machineinstrs $boundsLlvm -o $boundsMachine
          if ($LASTEXITCODE -ne 0) {
            throw "Windows exact-i32-array-v0 $boundsCase machine verification failed"
          }

          $publicOutput = @(cargo run --locked --quiet --manifest-path src/compiler/Cargo.toml -- run $boundsSource --language-profile exact-i32-array-v0 2>&1)
          $publicStatus = $LASTEXITCODE
          $publicOutput | ForEach-Object { Write-Host $_ }
          if ($publicStatus -eq 0) {
            throw "Windows exact-i32-array-v0 $boundsCase public run did not trap"
          }

          foreach ($optimization in @(0, 2)) {
            $boundsExecutable = Join-Path $env:RUNNER_TEMP "exact_i32_array_$boundsCase.o$optimization.exe"
            & "$llvmBin\clang.exe" "-O$optimization" $boundsLlvm -o $boundsExecutable
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $boundsExecutable -PathType Leaf)) {
              throw "Windows exact-i32-array-v0 $boundsCase O$optimization link failed"
            }
            $native = Invoke-ExactI32Array $boundsExecutable
            if ($native.ExitCode -eq 0 -or $native.Stdout -cne "" -or $native.Stderr -cne "") {
              throw "Windows exact-i32-array-v0 $boundsCase O$optimization did not fail cleanly"
            }
          }
        }
        Write-Host "exact i32 fixed-array CPU profile passed on Windows at O0 and O2"
        $global:LASTEXITCODE = 0

