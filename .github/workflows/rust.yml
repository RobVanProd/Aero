    - name: Confirm Windows LLVM 22 rejects known-invalid IR
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $false
        $invalidIr = Join-Path $env:RUNNER_TEMP "core078-known-invalid.ll"
        @(
          'define i32 @known_invalid() {'
          'entry:'
          '  ret i64 0'
          '}'
        ) | Set-Content -LiteralPath $invalidIr
        & "$env:LLVM_ROOT\bin\opt.exe" -passes=verify -disable-output $invalidIr
        $verifierExit = $LASTEXITCODE
        if ($verifierExit -eq 0) {
