s\.safe\.\k<inference_mv23_matrix_place>:\r?\n  (?<inference_mv23_matrix_extended>%reg[0-9]+) = sext i32 \k<inference_mv23_linear> to i64\r?\n  (?<inference_mv23_matrix_target>%ptr[0-9]+) = getelementptr inbounds \[6 x i32\], \[6 x i32\]\* \k<inference_mv23_matrix_base>, i64 0, i64 \k<inference_mv23_matrix_extended>\r?\n  (?<inference_mv23_matrix_value>%reg[0-9]+) = load i32, i32\* \k<inference_mv23_matrix_target>, align 4\r?\n  (?<inference_mv23_vector_index>%reg[0-9]+) = load i32, i32\* \k<inference_mv23_column_slot>, align 4\r?\n  (?<inference_mv23_vector_lower>%reg[0-9]+) = icmp sge i32 \k<inference_mv23_vector_index>, 0\r?\n  (?<inference_mv23_vector_upper>%reg[0-9]+) = icmp slt i32 \k<inference_mv23_vector_index>, 3\r?\n  (?<inference_mv23_vector_inbounds>%reg[0-9]+) = and i1 \k<inference_mv23_vector_lower>, \k<inference_mv23_vector_upper>\r?\n  br i1 \k<inference_mv23_vector_inbounds>, label %aero\.bounds\.safe\.(?<inference_mv23_vector_place>[0-9]+), label %aero\.bounds\.trap\.\k<inference_mv23_vector_place>\r?\naero\.bounds\.trap\.\k<inference_mv23_vector_place>:\r?\n  call void @llvm\.trap\(\)\r?\n  unreachable\r?\naero\.bounds\.safe\.\k<inference_mv23_vector_place>:\r?\n  (?<inference_mv23_vector_extended>%reg[0-9]+) = sext i32 \k<inference_mv23_vector_index> to i64\r?\n  (?<inference_mv23_vector_target>%ptr[0-9]+) = getelementptr inbounds \[3 x i32\], \[3 x i32\]\* \k<inference_mv23_vector_base>, i64 0, i64 \k<inference_mv23_vector_extended>\r?\n  (?<inference_mv23_vector_value>%reg[0-9]+) = load i32, i32\* \k<inference_mv23_vector_target>, align 4\r?\n  (?<inference_mv23_product>%reg[0-9]+) = mul i32 \k<inference_mv23_matrix_value>, \k<inference_mv23_vector_value>\r?\n  (?<inference_mv23_sum>%reg[0-9]+) = add i32 \k<inference_mv23_accumulator>, \k<inference_mv23_product>\r?\n  store i32 \k<inference_mv23_sum>, i32\* \k<inference_mv23_accumulator_slot>, align 4(?:(?!^}).)*?^  (?<inference_mv23_output_index>%reg[0-9]+) = load i32, i32\* \k<inference_mv23_row_slot>, align 4\r?\n  (?<inference_mv23_output_lower>%reg[0-9]+) = icmp sge i32 \k<inference_mv23_output_index>, 0\r?\n  (?<inference_mv23_output_upper>%reg[0-9]+) = icmp slt i32 \k<inference_mv23_output_index>, 2\r?\n  (?<inference_mv23_output_inbounds>%reg[0-9]+) = and i1 \k<inference_mv23_output_lower>, \k<inference_mv23_output_upper>\r?\n  br i1 \k<inference_mv23_output_inbounds>, label %aero\.bounds\.safe\.(?<inference_mv23_output_place>[0-9]+), label %aero\.bounds\.trap\.\k<inference_mv23_output_place>\r?\naero\.bounds\.trap\.\k<inference_mv23_output_place>:\r?\n  call void @llvm\.trap\(\)\r?\n  unreachable\r?\naero\.bounds\.safe\.\k<inference_mv23_output_place>:\r?\n  (?<inference_mv23_output_extended>%reg[0-9]+) = sext i32 \k<inference_mv23_output_index> to i64\r?\n  (?<inference_mv23_output_target>%ptr[0-9]+) = getelementptr inbounds \[2 x i32\], \[2 x i32\]\* \k<inference_mv23_output_base>, i64 0, i64 \k<inference_mv23_output_extended>\r?\n  (?<inference_mv23_output_value>%reg[0-9]+) = load i32, i32\* \k<inference_mv23_accumulator_slot>, align 4\r?\n  store i32 \k<inference_mv23_output_value>, i32\* \k<inference_mv23_output_target>, align 4\r?$'
            inference_matvec_2x3_count="$(grep -Pzo -- "${inference_matvec_2x3_pattern}" <(printf '%s\n' "${inference_matvec_2x3_llvm}") | tr -cd '\000' | wc -c)"
            test "${inference_matvec_2x3_count}" -eq 1
            inference_matvec_2x2_pattern='(?ms)^  (?<inference_mv22_matrix_base>%ptr[0-9]+) = alloca \[4 x i32\], align 8\r?\n  store \[4 x i32\] %aero\.arg\.matrix, \[4 x i32\]\* \k<inference_mv22_matrix_base>, align 8\r?\n  (?<inference_mv22_vector_base>(?!\k<inference_mv22_matrix_base>)%ptr[0-9]+) = alloca \[2 x i32\], align 8\r?\n  store \[2 x i32\] %aero\.arg\.vector, \[2 x i32\]\* \k<inference_mv22_vector_base>, align 8(?:(?!^}).)*?^  (?<inference_mv22_output_base>(?!\k<inference_mv22_matrix_base>)(?!\k<inference_mv22_vector_base>)%ptr[0-9]+) = alloca \[2 x i32\], align 8\r?\n  store \[2 x i32\] %reg[0-9]+, \[2 x i32\]\* \k<inference_mv22_output_base>, align 8\r?\n  (?<inference_mv22_row_slot>%ptr[0-9]+) = alloca i32, align 4(?:(?!^}).)*?^  (?<inference_mv22_column_slot>%ptr[0-9]+) = alloca i32, align 4(?:(?!^}).)*?^  (?<inference_mv22_accumulator_slot>%ptr[0-9]+) = alloca i32, align 4\r?\n  store i32 0, i32\* \k<inference_mv22_accumulator_slot>, align 4(?:(?!^}).)*?^  (?<inference_mv22_accumulator>%reg[0-9]+) = load i32, i32\* \k<inference_mv22_accumulator_slot>, align 4\r?\n  (?<inference_mv22_row>%reg[0-9]+) = load i32, i32\* \k<inference_mv22_row_slot>, align 4\r?\n  (?<inference_mv22_row_times_two>%reg[0-9]+) = mul i32 \k<inference_mv22_row>, 2\r?\n  (?<inference_mv22_column>%reg[0-9]+) = load i32, i32\* \k<inference_mv22_column_slot>, align 4\r?\n  (?<inference_mv22_linear>%reg[0-9]+) = add i32 \k<inference_mv22_row_times_two>, \k<inference_mv22_column>\r?\n  (?<inference_mv22_matrix_lower>%reg[0-9]+) = icmp sge i32 \k<inference_mv22_linear>, 0\r?\n  (?<inference_mv22_matrix_upper>%reg[0-9]+) = icmp slt i32 \k<inference_mv22_linear>, 4\r?\n  (?<inference_mv22_matrix_inbounds>%reg[0-9]+) = and i1 \k<inference_mv22_matrix_lower>, \k<inference_mv22_matrix_upper>\r?\n  br i1 \k<inference_mv22_matrix_inbounds>, label %aero\.bounds\.safe\.(?<inference_mv22_matrix_place>[0-9]+), label %aero\.bounds\.trap\.\k<inference_mv22_matrix_place>\r?\naero\.bounds\.trap\.\k<inference_mv22_matrix_place>:\r?\n  call void @llvm\.trap\(\)\r?\n  unreachable\r?\naero\.bounds\.safe\.\k<inference_mv22_matrix_place>:\r?\n  (?<inference_mv22_matrix_extended>%reg[0-9]+) = sext i32 \k<inference_mv22_linear> to i64\r?\n  (?<inference_mv22_matrix_target>%ptr[0-9]+) = getelementptr inbounds \[4 x i32\], \[4 x i32\]\* \k<inference_mv22_matrix_base>, i64 0, i64 \k<inference_mv22_matrix_extended>\r?\n  (?<inference_mv22_matrix_value>%reg[0-9]+) = load i32, i32\* \k<inference_mv22_matrix_target>, align 4\r?\n  (?<inference_mv22_vector_index>%reg[0-9]+) = load i32, i32\* \k<inference_mv22_column_slot>, align 4\r?\n  (?<inference_mv22_vector_lower>%reg[0-9]+) = icmp sge i32 \k<inference_mv22_vector_index>, 0\r?\n  (?<inference_mv22_vector_upper>%reg[0-9]+) = icmp slt i32 \k<inference_mv22_vector_index>, 2\r?\n  (?<inference_mv22_vector_inbounds>%reg[0-9]+) = and i1 \k<inference_mv22_vector_lower>, \k<inference_mv22_vector_upper>\r?\n  br i1 \k<inference_mv22_vector_inbounds>, label %aero\.bounds\.safe\.(?<inference_mv22_vector_place>[0-9]+), label %aero\.bounds\.trap\.\k<inference_mv22_vector_place>\r?\naero\.bounds\.trap\.\k<inference_mv22_vector_place>:\r?\n  call void @llvm\.trap\(\)\r?\n  unreachable\r?\naero\.bounds\.safe\.\k<inference_mv22_vector_place>:\r?\n  (?<inference_mv22_vector_extended>%reg[0-9]+) = sext i32 \k<inference_mv22_vector_index> to i64\r?\n  (?<inference_mv22_vector_target>%ptr[0-9]+) = getelementptr inbounds \[2 x i32\], \[2 x i32\]\* \k<inference_mv22_vector_base>, i64 0, i64 \k<inference_mv22_vector_extended>\r?\n  (?<inference_mv22_vector_value>%reg[0-9]+) = load i32, i32\* \k<inference_mv22_vector_target>, align 4\r?\n  (?<inference_mv22_product>%reg[0-9]+) = mul i32 \k<inference_mv22_matrix_value>, \k<inference_mv22_vector_value>\r?\n  (?<inference_mv22_sum>%reg[0-9]+) = add i32 \k<inference_mv22_accumulator>, \k<inference_mv22_product>\r?\n  store i32 \k<inference_mv22_sum>, i32\* \k<inference_mv22_accumulator_slot>, align 4(?:(?!^}).)*?^  (?<inference_mv22_output_index>%reg[0-9]+) = load i32, i32\* \k<inference_mv22_row_slot>, align 4\r?\n  (?<inference_mv22_output_lower>%reg[0-9]+) = icmp sge i32 \k<inference_mv22_output_index>, 0\r?\n  (?<inference_mv22_output_upper>%reg[0-9]+) = icmp slt i32 \k<inference_mv22_output_index>, 2\r?\n  (?<inference_mv22_output_inbounds>%reg[0-9]+) = and i1 \k<inference_mv22_output_lower>, \k<inference_mv22_output_upper>\r?\n  br i1 \k<inference_mv22_output_inbounds>, label %aero\.bounds\.safe\.(?<inference_mv22_output_place>[0-9]+), label %aero\.bounds\.trap\.\k<inference_mv22_output_place>\r?\naero\.bounds\.trap\.\k<inference_mv22_output_place>:\r?\n  call void @llvm\.trap\(\)\r?\n  unreachable\r?\naero\.bounds\.safe\.\k<inference_mv22_output_place>:\r?\n  (?<inference_mv22_output_extended>%reg[0-9]+) = sext i32 \k<inference_mv22_output_index> to i64\r?\n  (?<inference_mv22_output_target>%ptr[0-9]+) = getelementptr inbounds \[2 x i32\], \[2 x i32\]\* \k<inference_mv22_output_base>, i64 0, i64 \k<inference_mv22_output_extended>\r?\n  (?<inference_mv22_output_value>%reg[0-9]+) = load i32, i32\* \k<inference_mv22_accumulator_slot>, align 4\r?\n  store i32 \k<inference_mv22_output_value>, i32\* \k<inference_mv22_output_target>, align 4\r?$'
            inference_matvec_2x2_count="$(grep -Pzo -- "${inference_matvec_2x2_pattern}" <(printf '%s\n' "${inference_matvec_2x2_llvm}") | tr -cd '\000' | wc -c)"
            test "${inference_matvec_2x2_count}" -eq 1
            inference_guard_pattern='(?m)^  (?<inference_guard_lower>%reg[0-9]+) = icmp sge i32 (?<inference_guard_index>%reg[0-9]+), 0\r?\n  (?<inference_guard_upper>%reg[0-9]+) = icmp slt i32 \k<inference_guard_index>, (?<inference_guard_bound>[0-9]+)\r?\n  (?<inference_guard_inbounds>%reg[0-9]+) = and i1 \k<inference_guard_lower>, \k<inference_guard_upper>\r?\n  br i1 \k<inference_guard_inbounds>, label %aero\.bounds\.safe\.(?<inference_guard_place>[0-9]+), label %aero\.bounds\.trap\.\k<inference_guard_place>\r?\naero\.bounds\.trap\.\k<inference_guard_place>:\r?\n  call void @llvm\.trap\(\)\r?\n  unreachable\r?\naero\.bounds\.safe\.\k<inference_guard_place>:\r?\n  (?<inference_guard_extended>%reg[0-9]+) = sext i32 \k<inference_guard_index> to i64\r?\n  %ptr[0-9]+ = getelementptr inbounds (?<inference_guard_aggregate>\[\k<inference_guard_bound> x i32\]), \k<inference_guard_aggregate>\* %ptr[0-9]+, i64 0, i64 \k<inference_guard_extended>\r?$'
            inference_guard_count="$(grep -Pzo -- "${inference_guard_pattern}" <(printf '%s\n' "${inference_decode_llvm}") | tr -cd '\000' | wc -c)"
            test "${inference_guard_count}" -eq 18
            inference_matvec_2x3_guard_count="$(grep -Pzo -- "${inference_guard_pattern}" <(printf '%s\n' "${inference_matvec_2x3_llvm}") | tr -cd '\000' | wc -c)"
            test "${inference_matvec_2x3_guard_count}" -eq 3
            inference_matvec_2x2_guard_count="$(grep -Pzo -- "${inference_guard_pattern}" <(printf '%s\n' "${inference_matvec_2x2_llvm}") | tr -cd '\000' | wc -c)"
            test "${inference_matvec_2x2_guard_count}" -eq 3
          fi

          opt-22 -passes=verify -disable-output "${llvm}"
          llc-22 -verify-machineinstrs "${llvm}" -o "${machine}"
          clang-22 -O0 "${llvm}" -o "${executable_o0}"
          clang-22 -O2 "${llvm}" -o "${executable_o2}"

          for executable in "${executable_o0}" "${executable_o2}"; do
            stdout="${executable}.stdout"
            stderr="${executable}.stderr"
            set +e
            "${executable}" >"${stdout}" 2>"${stderr}"
            native_status=$?
            set -e
            test "${native_status}" -eq "${expected}"
            test ! -s "${stdout}"
            test ! -s "${stderr}"
          done

          set +e
          public_output="$(cargo run --locked --quiet --manifest-path src/compiler/Cargo.toml -- \
            run "${source}" --language-profile exact-i32-array-v0 2>&1)"
          public_status=$?
          set -e
          printf '%s\n' "${public_output}"
          test "${public_status}" -eq "${expected}"
          test "$(printf '%s\n' "${public_output}" | grep -Fxc "Exit code: ${expected}")" -eq 1
        done

        for bounds_file in negative_index.aero equal_to_count_index.aero negative_write_index.aero equal_to_count_write_index.aero; do
          bounds_case="${bounds_file%.aero}"
          bounds_source="examples/fixed_int_array_v0/runtime_fail/${bounds_file}"
          bounds_llvm="${RUNNER_TEMP}/exact_i32_array_${bounds_case}.linux.ll"
          bounds_machine="${RUNNER_TEMP}/exact_i32_array_${bounds_case}.linux.s"

          cargo run --locked --quiet --manifest-path src/compiler/Cargo.toml -- \
            check "${bounds_source}" --language-profile exact-i32-array-v0
          cargo run --locked --quiet --manifest-path src/compiler/Cargo.toml -- \
            build "${bounds_source}" -o "${bounds_llvm}" --require-llvm-verifier \
            --language-profile exact-i32-array-v0
          grep -Fq 'declare void @llvm.trap()' "${bounds_llvm}"
          grep -Fq 'icmp sge i32' "${bounds_llvm}"
          grep -Fq 'icmp slt i32' "${bounds_llvm}"
          grep -Fq 'sext i32' "${bounds_llvm}"
          if [[ "${bounds_case}" == *_write_index ]]; then
            bounds_write_pattern='(?m)^  (?<bounds_write_lower>%reg[0-9]+) = icmp sge i32 (?<bounds_write_index>%reg[0-9]+), 0\r?\n  (?<bounds_write_upper>%reg[0-9]+) = icmp slt i32 \k<bounds_write_index>, 2\r?\n  (?<bounds_write_inbounds>%reg[0-9]+) = and i1 \k<bounds_write_lower>, \k<bounds_write_upper>\r?\n  br i1 \k<bounds_write_inbounds>, label %aero\.bounds\.safe\.(?<bounds_write_place>[0-9]+), label %aero\.bounds\.trap\.\k<bounds_write_place>\r?\naero\.bounds\.trap\.\k<bounds_write_place>:\r?\n  call void @llvm\.trap\(\)\r?\n  unreachable\r?\naero\.bounds\.safe\.\k<bounds_write_place>:\r?\n  (?<bounds_write_extended>%reg[0-9]+) = sext i32 \k<bounds_write_index> to i64\r?\n  (?<bounds_write_target>%ptr[0-9]+) = getelementptr inbounds \[2 x i32\], \[2 x i32\]\* %ptr[0-9]+, i64 0, i64 \k<bounds_write_extended>\r?\n  store i32 9, i32\* \k<bounds_write_target>, align 4\r?$'
            bounds_write_count="$(grep -Pzo -- "${bounds_write_pattern}" "${bounds_llvm}" | tr -cd '\000' | wc -c)"
            test "${bounds_write_count}" -eq 1
          fi
          opt-22 -passes=verify -disable-output "${bounds_llvm}"
          llc-22 -verify-machineinstrs "${bounds_llvm}" -o "${bounds_machine}"

          set +e
          cargo run --locked --quiet --manifest-path src/compiler/Cargo.toml -- \
            run "${bounds_source}" --language-profile exact-i32-array-v0
          public_bounds_status=$?
          set -e
          test "${public_bounds_status}" -ne 0

          for optimization in 0 2; do
            bounds_executable="${RUNNER_TEMP}/exact_i32_array_${bounds_case}.o${optimization}"
            clang-22 "-O${optimization}" "${bounds_llvm}" -o "${bounds_executable}"
            set +e
            "${bounds_executable}" >"${bounds_executable}.stdout" 2>"${bounds_executable}.stderr"
            bounds_status=$?
            set -e
            test "${bounds_status}" -ne 0
            test ! -s "${bounds_executable}.stdout"
            test ! -s "${bounds_executable}.stderr"
          done
        done
        echo "exact i32 fixed-array CPU profile passed at O0 and O2"

    - name: Test exact i32 record and Result CPU profile at O0 and O2
      if: matrix.rust == 'stable'
      shell: bash
      run: |
        set -euo pipefail
        export PATH="/usr/lib/llvm-22/bin:${PATH}"
        source="examples/fixed_int_array_v0/exact_record_result_application.aero"
        llvm="${RUNNER_TEMP}/exact_record_result.linux.ll"
        repeat_llvm="${RUNNER_TEMP}/exact_record_result.linux.repeat.ll"
        bitcode="${RUNNER_TEMP}/exact_record_result.linux.bc"
        machine="${RUNNER_TEMP}/exact_record_result.linux.s"
        executable_o0="${RUNNER_TEMP}/exact_record_result.o0"
        executable_o2="${RUNNER_TEMP}/exact_record_result.o2"

        cargo run --locked --quiet --manifest-path src/compiler/Cargo.toml -- \
          check "${source}" --language-profile exact-i32-record-result-v0
        for output in "${llvm}" "${repeat_llvm}"; do
          cargo run --locked --quiet --manifest-path src/compiler/Cargo.toml -- \
            build "${source}" -o "${output}" --require-llvm-verifier \
            --language-profile exact-i32-record-result-v0
        done
        cmp -s "${llvm}" "${repeat_llvm}"
        for anchor in \
          '%aero.struct.Buffer = type { [8 x i32], i32 }' \
          '%aero.struct.Request = type { %aero.struct.Buffer, i32 }' \
          '%aero.struct.Success = type { [8 x i32], i32, i32, i1 }' \
          'define { i32, %aero.struct.Success, i32 } @transform(%aero.struct.Request %aero.arg.request)' \
          'define i32 @score({ i32, %aero.struct.Success, i32 } %aero.arg.result)' \
